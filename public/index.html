<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PR Inbox</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23092012'/%3E%3Crect x='12' y='15' width='40' height='7' rx='3.5' fill='%236dd17f'/%3E%3Crect x='12' y='28' width='30' height='7' rx='3.5' fill='%23f2b966'/%3E%3Crect x='12' y='41' width='22' height='7' rx='3.5' fill='%23d7f4e0'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Bricolage+Grotesque:wght@500;600;700&display=swap">
<style>
/* Deep green: one dark theme. Every color is a token here, and the status hues are shared by lane dots,
   tags and runs. */
:root {
  color-scheme: dark;
  --bg: oklch(0.22 0.04 155);
  --panel: oklch(0.26 0.035 155);
  --raise: oklch(0.28 0.038 155);
  --raise-hover: oklch(0.32 0.038 155);
  --line: oklch(0.33 0.03 155);
  --line-strong: oklch(0.36 0.035 155);
  --hover: oklch(1 0 0 / .10);
  --text: oklch(0.96 0.01 155);
  --sub: oklch(0.78 0.02 155);
  --dim: oklch(0.66 0.02 155);
  --link: oklch(0.86 0.06 155);
  --primary: oklch(0.94 0.04 155);
  --primary-ink: oklch(0.17 0.025 155);
  --ok: oklch(0.78 0.15 148);
  --ok-ink: oklch(0.84 0.14 148);
  --warn: oklch(0.82 0.12 75);
  --warn-ink: oklch(0.86 0.12 75);
  --bad: oklch(0.72 0.17 25);
  --bad-ink: oklch(0.82 0.14 25);
  --info: oklch(0.75 0.11 260);
  --info-ink: oklch(0.84 0.09 260);
  --approval: oklch(0.74 0.08 200);
  --reviewed: oklch(0.62 0.06 260);
  --mute: oklch(0.55 0.02 155);
  --stale: oklch(0.45 0.02 155);
  --font: 'Figtree', system-ui, sans-serif;
  --display: 'Bricolage Grotesque', 'Figtree', sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --shadow: 0 18px 48px oklch(0.12 0.03 155 / .6);
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; line-height: 1.4; }
a { color: var(--link); text-underline-offset: 3px; }
a:hover { color: #fff; }
h1, h2 { margin: 0; font-family: var(--display); font-weight: 600; line-height: 1.2; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
::selection { background: oklch(0.94 0.04 155 / .3); }
code { font-family: var(--mono); font-size: 12px; }
.sub { color: var(--sub); }
.dim { color: var(--dim); }
.grow { flex: 1 1 auto; }
.wrap { max-width: 1376px; margin: 0 auto; padding-inline: 32px; }

/* controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--raise); color: var(--text); font-weight: 500; white-space: nowrap; text-decoration: none; transition: background-color .15s, border-color .15s, color .15s, transform .12s; }
.btn:hover { background: var(--raise-hover); color: var(--text); }
.btn:active:not(:disabled) { transform: scale(.96); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { display: block; flex: none; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { background: #fff; color: var(--primary-ink); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--sub); }
.btn-ghost:hover { background: var(--hover); color: #fff; }
.btn-sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn-icon { width: 32px; padding: 0; }
.btn-admin { background: var(--bad); border-color: var(--bad); color: var(--primary-ink); }
.btn-admin:hover:not(:disabled) { background: var(--bad-ink); color: var(--primary-ink); }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid oklch(0.34 0.035 155); background: transparent; color: oklch(0.82 0.02 155); font-weight: 500; transition: background-color .18s, border-color .18s, color .18s, transform .12s; }
.pill:hover { background: var(--hover); color: #fff; }
.pill:active { transform: scale(.95); }
.pill[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.pill .n { font-variant-numeric: tabular-nums; opacity: .7; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--dot, var(--mute)); }
.tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag-ok { background: oklch(0.78 0.15 148 / .18); color: var(--ok-ink); }
.tag-warn { background: oklch(0.82 0.12 75 / .18); color: var(--warn-ink); }
.tag-bad { background: oklch(0.72 0.17 25 / .20); color: var(--bad-ink); }
.tag-info { background: oklch(0.75 0.11 260 / .20); color: var(--info-ink); }
.tag-mute { background: oklch(1 0 0 / .08); color: var(--sub); }
.input { width: 100%; min-height: 36px; padding: 8px 12px; font: inherit; font-size: 13.5px; color: var(--text); caret-color: var(--primary); background: var(--bg); border: 1px solid var(--line-strong); border-radius: 8px; }
.input:hover { border-color: var(--mute); }
.input:focus-visible { border-color: var(--primary); outline-offset: 0; }
textarea.input { min-height: 90px; resize: vertical; line-height: 1.5; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--sub); cursor: pointer; }
.check input { accent-color: var(--primary); width: 16px; height: 16px; }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
/* What a row says instead of its buttons while something runs on it, or once it is done. */
.state { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 4px; border: 0; background: none; font-weight: 600; color: var(--sub); }
button.state:hover { color: #fff; }
.state.ok { color: var(--ok-ink); }

/* Motion: things animate the first time they appear, never on a routine re-render. */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes zoom { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
@keyframes drop { from { opacity: 0; transform: translateY(-6px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.3); } 65% { opacity: 1; transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes leave { to { opacity: 0; transform: translateY(8px); } }
.enter { animation: rise .5s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(var(--i, 0) * 45ms); }
.spinning svg { animation: spin .9s linear infinite; }
.pop { animation: pop .45s cubic-bezier(.2, .8, .2, 1) both; }
.menu.anim { animation: drop .16s ease-out both; transform-origin: top right; }
.dialog-backdrop.anim { animation: fade .2s ease both; }
.dialog-backdrop.anim .dialog { animation: zoom .28s cubic-bezier(.2, .8, .2, 1) both; }
.anim-fade { animation: fade .35s ease both; }
.toast { animation: rise .32s cubic-bezier(.2, .8, .2, 1) both; }
.toast.out { animation: leave .25s ease forwards; }

/* header */
.top { position: sticky; top: 0; z-index: 10; background: var(--bg); border-bottom: 1px solid var(--line); }
.top-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; min-height: 60px; padding-block: 10px; }
.logo { width: 32px; height: 32px; border-radius: 8px; background: #fff; display: flex; align-items: center; justify-content: center; flex: none; }
.top h1 { font-size: 20px; }
.updated { display: inline-flex; align-items: center; gap: 8px; }
/* The pills wrap in their own column, so the view switches keep one spot whatever the filter shows. */
.filters { display: flex; align-items: flex-start; gap: 8px 24px; padding-bottom: 14px; }
.pills { flex: 1 1 0; min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.views { flex: none; display: flex; align-items: center; gap: 16px; }
.group-by { display: flex; align-items: center; gap: 8px; }
/* What you ticked, and the two things it can do. */
.pick-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; padding: 8px 8px 8px 16px; border-radius: 10px; background: var(--raise); border: 1px solid var(--line-strong); }
.pick-bar.anim { animation: drop .16s ease-out both; }
.pick-bar .check { color: var(--text); }
.pick-bar .pick { margin: 0; }

/* notices */
.notice { padding-top: 20px; }
.notice-box { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 10px; border: 1px solid oklch(0.82 0.12 75 / .4); background: oklch(0.82 0.12 75 / .10); }
.notice-box > svg { color: var(--warn-ink); }
.notice-text { flex: 1 1 320px; }

/* board */
.board { padding-top: 20px; padding-bottom: 48px; display: flex; flex-direction: column; gap: 24px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
.empty { padding: 24px 20px; color: var(--sub); }
.skeleton { height: 64px; margin: 14px 16px; border-radius: 8px; background: var(--raise); animation: pulse 1.4s ease-in-out infinite; }

/* Claude's triage */
.hero { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; }
.hero-kicker { display: flex; align-items: center; gap: 10px; }
.hero-badge { width: 26px; height: 26px; border-radius: 8px; background: var(--primary); color: var(--primary-ink); display: flex; align-items: center; justify-content: center; flex: none; }
.hero-label { font-size: 12px; font-weight: 600; color: var(--sub); display: flex; align-items: center; gap: 8px; }
.hero-line { font-size: 16px; font-weight: 600; line-height: 1.45; text-wrap: pretty; max-width: 820px; }
.hero-line.failed { color: var(--bad-ink); }
.hero-detail { display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.6; color: var(--sub); max-width: 820px; }
.hero-detail .sec { font-weight: 700; color: var(--text); margin-top: 8px; }
.hero-detail .gap { height: 4px; }
.hero-detail b { color: var(--text); }
.hero-detail code { background: var(--bg); padding: 0 5px; border-radius: 4px; }
.hero-acts { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.hero-link { border: 0; background: none; padding: 2px 0; font-weight: 600; color: var(--link); display: inline-flex; align-items: center; gap: 6px; }
.hero-link:hover { color: #fff; }
.hero-link svg { transition: transform .2s; }
.hero-link[aria-expanded="true"] svg { transform: rotate(180deg); }

/* groups: one per lane or per repository */
.group { position: relative; display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 130px; }
.group-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 12px; padding: 0 4px; }
.group-head > .dot { align-self: center; }
/* The heading's select-all tick sits right above the rows' ticks. */
.group-head > .pick { align-self: center; margin: 0 -2px 0 13px; }
.group-head h2 { font-size: 18px; }
.group-head h2 a { color: inherit; text-decoration: none; }
.group-head h2 a:hover { text-decoration: underline; }
.head-acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.group-note { padding: 0 4px; margin-top: -4px; font-size: 12px; color: var(--dim); }
.ver { font-family: var(--mono); font-size: 12px; color: var(--text); }

/* PR rows */
.pr { position: relative; transition: opacity .3s; }
.pr + .pr { border-top: 1px solid var(--line); }
.pr.done { opacity: .6; }
/* Someone else's PR: tinted, with a bar in the review color and its author beside the number. */
.pr.theirs { background: oklch(0.75 0.11 260 / .07); box-shadow: inset 3px 0 0 var(--info); }
.panel > .pr:first-child { border-top-left-radius: 11px; border-top-right-radius: 11px; }
.panel > .pr:last-child { border-bottom-left-radius: 11px; border-bottom-right-radius: 11px; }
.author { display: inline-flex; align-items: center; gap: 5px; align-self: center; height: 22px; padding: 0 8px 0 3px; border-radius: 999px; background: oklch(0.75 0.11 260 / .18); color: var(--info-ink); font-size: 12px; font-weight: 600; white-space: nowrap; }
.author img { width: 16px; height: 16px; border-radius: 50%; background: var(--raise); }
.row { display: flex; flex-wrap: wrap; gap: 16px; padding: 14px 16px; align-items: flex-start; }
.row > .dot { margin-top: 7px; }
/* The tick in front of each row. Someone else's PR keeps the empty slot, so every title lines up. */
.pick { width: 16px; height: 16px; margin: 3px -6px 0 0; flex: none; accent-color: var(--primary); cursor: pointer; }
.pick:disabled { opacity: .35; cursor: not-allowed; }
.pr-main { flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.pr-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; }
.pr-title { font-size: 15px; font-weight: 600; color: var(--text); text-decoration: none; text-wrap: pretty; overflow-wrap: anywhere; }
.pr-title:hover { color: #fff; text-decoration: underline; }
.pr-num { font-family: var(--mono); font-size: 12px; color: var(--dim); }
.pr-num a { color: inherit; text-decoration: none; }
.pr-num a:hover { color: var(--text); text-decoration: underline; }
.pr-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.branch { display: inline-block; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; font-family: var(--mono); font-size: 12px; }
.threads { color: var(--warn-ink); }
.fails { display: flex; flex-wrap: wrap; gap: 12px; font-family: var(--mono); font-size: 12px; }
.fails a, .fails span { color: var(--bad-ink); text-decoration: none; }
.fails a:hover { text-decoration: underline; }
.pr-acts { position: relative; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }

/* the runs strip under a row */
.strip { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 0 16px 12px 66px; color: var(--sub); }
.strip .btn { height: 24px; }
.strip-toggle { padding: 0 6px 0 2px; color: var(--sub); }
.strip-toggle b { font-weight: 600; }
.strip-toggle svg { transition: transform .2s; }
.strip-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
.chip { all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; min-width: 0; max-width: 100%; border-radius: 6px; }
.chip:hover { color: #fff; }
.chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.chip .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 520px; }
.chip.working .dot { animation: pulse 1.4s ease-in-out infinite; }

/* row menu. The row and group holding an open menu sit above their later siblings, which would paint over it. */
.pr:has(.menu), .group:has(.menu) { z-index: 30; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 240px; padding: 6px; display: flex; flex-direction: column; background: var(--raise); border: 1px solid var(--line-strong); border-radius: 10px; box-shadow: var(--shadow); }
.menu button, .menu a { all: unset; cursor: pointer; padding: 8px 10px; border-radius: 6px; font-size: 13px; color: var(--text); }
.menu button:hover, .menu a:hover { background: var(--hover); color: #fff; }
.menu button:focus-visible, .menu a:focus-visible { outline: 2px solid var(--primary); }
.menu .sep { height: 1px; background: var(--line); margin: 6px 4px; }
.menu .danger { color: var(--bad-ink); }

/* run cards: a PR's own runs unfolded under its row, and the triage run inside its card */
.strip-runs { display: flex; flex-direction: column; gap: 8px; padding: 0 16px 14px 66px; }
.hero-run { margin-top: 4px; }
.run { background: var(--raise); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; transition: box-shadow .3s; }
.run.flash { box-shadow: 0 0 0 2px var(--primary); }
.run-toggle { all: unset; cursor: pointer; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; border-radius: 10px; }
.run-toggle:focus-visible { outline: 2px solid var(--primary); }
.run-top { display: flex; align-items: center; gap: 8px; }
.run.working .run-top .dot { animation: pulse 1.4s ease-in-out infinite; }
.run-title { font-size: 13.5px; font-weight: 600; margin-right: auto; overflow-wrap: anywhere; }
.chev { color: var(--dim); transition: transform .2s; flex: none; }
.run.open .chev { transform: rotate(180deg); }
.run-meta { font-size: 12px; color: var(--dim); padding-left: 16px; }
.run-pulse { color: var(--ok-ink); font-weight: 600; }
.run-preview { font-size: 12.5px; line-height: 1.45; color: var(--sub); padding-left: 16px; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.run-body { padding: 0 14px 14px 30px; display: flex; flex-direction: column; gap: 10px; }
.run-output { font-size: 13px; line-height: 1.55; text-wrap: pretty; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 360px; overflow: auto; }
.run-output code, .log code { background: var(--bg); padding: 0 4px; border-radius: 4px; font-size: 11.5px; }
.run-cwd { font-family: var(--mono); font-size: 11px; color: var(--dim); overflow-wrap: anywhere; }
.run-acts { display: flex; gap: 6px; flex-wrap: wrap; }
.log { max-height: 320px; overflow: auto; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 8px; background: var(--bg); font-size: 12.5px; line-height: 1.5; }
.ev-text, .ev-result { white-space: pre-wrap; overflow-wrap: anywhere; }
.ev-result { background: var(--panel); padding: 8px 10px; border-radius: 8px; }
.ev-tool, .ev-warn { font-family: var(--mono); font-size: 11px; color: var(--dim); overflow-wrap: anywhere; }
.ev-tool::before { content: "› "; color: var(--link); }
.ev-warn { color: var(--warn-ink); }
.ev-error { color: var(--bad-ink); font-weight: 600; overflow-wrap: anywhere; }
.ev-note { font-size: 11px; color: var(--dim); }
.ev-you { align-self: flex-end; max-width: 88%; background: oklch(0.36 0.05 155); padding: 6px 10px; border-radius: 10px 10px 4px 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
.reply { display: flex; flex-direction: column; gap: 8px; }
.reply textarea { min-height: 72px; }

/* dialogs */
.dialog-backdrop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: oklch(0.12 0.03 155 / .65); }
.dialog { width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 14px; background: var(--panel); border: 1px solid var(--line-strong); box-shadow: var(--shadow); }
.dialog-title { font-family: var(--display); font-size: 18px; font-weight: 600; }
.dialog-body { font-size: 13.5px; line-height: 1.55; color: var(--sub); }
.dialog-body b { color: var(--text); }
.dialog-body code { background: var(--bg); padding: 0 5px; border-radius: 4px; color: var(--text); }
.dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
.dialog ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; color: var(--text); }
.dialog ul span { color: var(--sub); }
.quick { display: flex; gap: 6px; flex-wrap: wrap; }
.ship-list { display: flex; flex-direction: column; gap: 10px; max-height: 52vh; overflow: auto; }
.ship-repo { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.ship-repo .head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-weight: 700; color: var(--text); }
.ship-repo p { font-size: 13px; line-height: 1.5; }
.ship-repo .check { align-items: flex-start; color: var(--text); }
.ship-repo .check input { margin-top: 2px; flex: none; }
.admin-warn { padding: 10px 14px; border-radius: 10px; background: oklch(0.72 0.17 25 / .14); border: 1px solid oklch(0.72 0.17 25 / .35); color: var(--bad-ink); font-size: 13px; line-height: 1.5; }
.admin-warn b { color: var(--bad-ink); }

.toasts { position: fixed; left: 24px; bottom: 24px; z-index: 60; display: flex; flex-direction: column; gap: 8px; }
.toast { max-width: 460px; padding: 9px 16px; border-radius: 10px; background: var(--primary); color: var(--primary-ink); box-shadow: var(--shadow); font-size: 13px; font-weight: 500; }
.toast.err { background: oklch(0.38 0.1 25); color: var(--text); }
.toast a { color: inherit; font-weight: 700; margin-left: 8px; }

/* The PR panel: click a row and its whole PR opens on the right while the board keeps its place on the left. */
:root { --detail-w: min(50vw, 780px); }
body.has-detail { padding-right: var(--detail-w); }
.pr .row { cursor: pointer; }
.pr.selected { background: oklch(0.94 0.04 155 / .07); box-shadow: inset 3px 0 0 var(--primary); }
.detail { position: fixed; top: 0; right: 0; bottom: 0; z-index: 40; width: var(--detail-w); overflow: auto; overscroll-behavior: contain; background: var(--panel); border-left: 1px solid var(--line-strong); }
.detail.anim { animation: slide .22s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes slide { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
.detail-head { position: sticky; top: 0; z-index: 2; display: flex; flex-direction: column; gap: 10px; padding: 14px 24px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
.detail-bar { display: flex; align-items: center; gap: 8px; min-height: 32px; }
.detail-bar .pr-num { font-size: 13px; }
.detail-title { font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1.3; text-wrap: pretty; overflow-wrap: anywhere; }
.detail-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; color: var(--sub); }
.detail-sub img { width: 18px; height: 18px; border-radius: 50%; vertical-align: middle; background: var(--raise); }
.detail-acts { position: relative; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.detail-body { display: flex; flex-direction: column; gap: 22px; padding: 18px 24px 48px; }
.facts { display: grid; grid-template-columns: 110px 1fr; gap: 10px 16px; align-items: start; }
.facts > dt { color: var(--dim); padding-top: 2px; }
.facts > dd { margin: 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
.checks { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; width: 100%; }
.checks a, .checks span { display: flex; align-items: center; gap: 8px; color: var(--sub); text-decoration: none; font-size: 12.5px; }
.checks a:hover { color: #fff; }
.fold > summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; color: var(--sub); }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary svg { transition: transform .2s; transform: rotate(-90deg); }
.fold[open] > summary svg { transform: none; }
.fold > summary:hover { color: #fff; }
.sec-title { font-family: var(--display); font-size: 15px; font-weight: 600; color: var(--sub); margin-bottom: 10px; }
.entries { display: flex; flex-direction: column; gap: 12px; }
.entry { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.entry-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; color: var(--sub); }
.entry-head img { width: 20px; height: 20px; border-radius: 50%; background: var(--raise); }
.entry-head b { color: var(--text); font-weight: 600; }
.entry > .md, .entry > .fold > .md { padding: 4px 14px 12px; }
.entry > .fold > summary { padding: 0 12px 10px; }
.detail .skeleton { margin: 0; height: 18px; }
/* Open PRs as tabs along the panel's top, and the Summary / Code switch. */
.ptabs { display: flex; gap: 4px; overflow-x: auto; margin: -4px -8px 0; padding: 0 8px 2px; scrollbar-width: none; }
.ptab { flex: none; display: inline-flex; align-items: center; gap: 4px; max-width: 220px; height: 28px; padding: 0 4px 0 10px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--dim); font-size: 12px; }
.ptab:hover { background: var(--hover); color: var(--text); }
.ptab[aria-current="true"] { background: var(--raise); border-color: var(--line-strong); color: var(--text); }
.ptab .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ptab .x { display: inline-flex; padding: 2px; border-radius: 4px; color: var(--dim); }
.ptab .x:hover { background: var(--hover); color: #fff; }
.views-sw { display: flex; gap: 4px; }
.anchor-wrap { position: relative; display: inline-flex; }
.facts .picker { display: flex; gap: 6px; width: 100%; max-width: 360px; }
.facts .picker .input { min-height: 28px; padding: 3px 10px; font-size: 12.5px; }
.compose { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.compose textarea { min-height: 84px; }
.compose .row-end { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
/* The Code tab: GitHub's unified diff, one fold per file. */
.files-sum { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; color: var(--sub); }
.files-index { display: flex; flex-direction: column; gap: 2px; margin-top: 8px; font-family: var(--mono); font-size: 12px; }
.files-index a { display: flex; gap: 10px; color: var(--sub); text-decoration: none; padding: 2px 4px; border-radius: 4px; }
.files-index a:hover { background: var(--hover); color: #fff; }
.files-index .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
.add-n { color: var(--ok-ink); } .del-n { color: var(--bad-ink); }
.file { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); scroll-margin-top: 230px; }
.file > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; font-family: var(--mono); font-size: 12px; position: sticky; top: 0; }
.file > summary::-webkit-details-marker { display: none; }
.file > summary svg { flex: none; transition: transform .2s; transform: rotate(-90deg); color: var(--dim); }
.file[open] > summary { border-bottom: 1px solid var(--line); }
.file[open] > summary svg { transform: none; }
.file > summary .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; color: var(--text); }
.diff { overflow-x: auto; font-family: var(--mono); font-size: 12px; line-height: 1.55; padding: 4px 0; }
.dl { display: grid; grid-template-columns: 44px 44px 1fr; min-width: max-content; }
.dl .ln { padding: 0 8px; text-align: right; color: var(--stale); user-select: none; }
.dl code { white-space: pre; padding: 0 12px 0 6px; font-size: 12px; }
.dl.add { background: oklch(0.78 0.15 148 / .12); } .dl.add code::before { content: "+"; color: var(--ok-ink); margin-right: 4px; }
.dl.del { background: oklch(0.72 0.17 25 / .13); } .dl.del code::before { content: "−"; color: var(--bad-ink); margin-right: 4px; }
.dl.ctx code::before { content: " "; margin-right: 4px; }
.dl.hunk { background: oklch(0.75 0.11 260 / .10); color: var(--info-ink); }
.dl.note code { color: var(--dim); font-style: italic; }
.no-patch { padding: 10px 14px; color: var(--dim); }
.search { width: 260px; min-height: 32px; padding: 5px 12px; }
/* GitHub's rendered markdown, in this page's colors. */
.md { font-size: 14px; line-height: 1.6; color: var(--text); overflow-wrap: anywhere; }
.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote, .md details { margin: 0 0 12px; }
.md h1, .md h2, .md h3, .md h4 { font-family: var(--display); font-weight: 600; margin: 20px 0 8px; line-height: 1.3; }
.md h1 { font-size: 20px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; } .md h4 { font-size: 14px; }
.md ul, .md ol { padding-left: 22px; }
.md li + li { margin-top: 3px; }
.md code { background: var(--raise); padding: 1px 5px; border-radius: 5px; font-size: 12.5px; }
.md pre { background: var(--bg); border: 1px solid var(--line); padding: 10px 12px; border-radius: 8px; overflow: auto; }
.md pre code { background: none; padding: 0; }
.md blockquote { padding-left: 12px; border-left: 3px solid var(--line-strong); color: var(--sub); }
.md table { border-collapse: collapse; display: block; overflow: auto; }
.md th, .md td { border: 1px solid var(--line-strong); padding: 5px 10px; text-align: left; }
.md img { max-width: 100%; height: auto; border-radius: 8px; background: var(--raise); }
.md hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; }
.md summary { cursor: pointer; color: var(--sub); }
.md .anchor, .md .octicon { display: none; }
.md input[type=checkbox] { accent-color: var(--primary); margin-right: 6px; }

@media (max-width: 760px) {
  :root { --detail-w: 100vw; }
  body.has-detail { padding-right: 0; overflow: hidden; }
  .wrap { padding-inline: 16px; }
  .top { position: static; }
  /* The dot stays beside the title; the buttons take their own line under it. */
  .pr-main { flex-basis: 0; }
  .pr-acts { flex-basis: 100%; justify-content: flex-start; padding-left: 50px; }
  .chip .t { max-width: 70vw; }
  .strip-runs { padding-left: 16px; }
  .filters { flex-wrap: wrap; }
  .views { flex: 1 1 100%; flex-wrap: wrap; gap: 8px 16px; }
  .search { width: 100%; order: 10; }
}
@media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 637.62 640.32" width="18" height="18"><path fill="#111" d="M259.12,400.64l-79.78,79.78V267.67c0-17.73,6.75-33.33,17.73-44.32l62.05-62.05V400.64z"/><path fill="#111" d="M458.54,320.86H338.9l-79.78,79.78h93.04c15.35-0.09,33.43-6.9,44.32-17.73L458.54,320.86z"/></svg></div>
    <h1>PR inbox</h1>
    <span class="sub" id="who"></span>
    <div class="grow"></div>
    <input class="input search" id="search" type="search" placeholder="Search  /  repo: author: label: #123" aria-label="Search pull requests" autocomplete="off" spellcheck="false">
    <span class="dim updated" id="updated"></span>
    <button class="btn" id="refresh-btn" data-act="refresh" title="Refresh the PRs (⌘R reloads the app)"><span data-icon="refresh"></span>Refresh</button>
    <button class="btn btn-primary" data-act="triage"><span data-icon="sparkle"></span>Triage with Claude</button>
  </div>
  <div class="wrap filters" id="filters"></div>
  <div class="wrap" id="picked"></div>
</header>
<div id="notice"></div>
<main class="wrap board" id="board"></main>
<aside class="detail" id="detail" hidden aria-label="Pull request"></aside>
<div id="dialog"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
// Lucide icons at stroke-width 2.
const ICON = {
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  sparkle: '<path d="M12 3l1.9 5.6L19.5 10.5l-5.6 1.9L12 18l-1.9-5.6L4.5 10.5l5.6-1.9z"/>',
  alert: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
  more: '<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  chevron: '<path d="m6 9 6 6 6-6"/>',
  shield: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  external: '<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  rocket: '<path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/>',
}
const icon = (name, size = 16, cls = '') => `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[name]}</svg>`

const DAY = 86400000
const plural = (n, one, many = one + 's') => `${n} ${n === 1 ? one : many}`
// Quick prompts as [text, writes]: a prompt that only asks leaves the "change code and push" box unticked.
const QUICK = [['Fix CI', true], ['Rebase onto main', true], ['Address the review comments', true], ['Summarise this PR for a reviewer', false], ['Should I close this?', false]]
const ADDRESS = 'Address the review comments on this PR. Read every unresolved review thread with gh, make the changes they ask for, commit and push, then list what you changed for each comment. Do not reply to or resolve the threads.'

// Every PR action, by verb: its menu label, the Claude run (kind and note) or gh action it performs, and
// who gets it. `writes` verbs need a PR a run may push to (the server marks fork PRs and branch names an
// auto-mode run will not type as not writable), `mine` verbs are for your own PRs, `when` adds a test of
// its own, and a `confirm` dialog asks first.
const VERBS = {
  fix: { menu: 'Fix CI with Claude', run: 'fix', writes: true },
  rebase: { menu: 'Rebase with Claude', run: 'rebase', writes: true },
  // One run: resolve the conflicts and push, then the thermo-nuclear review of the result.
  resolve: { menu: 'Resolve conflicts, then review', run: 'resolve', writes: true, mine: true, when: pr => pr.mergeable === 'CONFLICTING' },
  review: { menu: 'Review with Claude', run: 'review' },
  // Offered until the PR's current commit has passed the review; a new commit makes it outdated and offers it again.
  thermo: { menu: 'Thermo-nuclear review', run: 'thermo', writes: true, mine: true, when: pr => review(pr).state !== 'pass' },
  relevance: { menu: 'Still relevant? Close or rescue', run: 'relevance', writes: true, mine: true, confirm: {
    title: pr => `Is ${short(pr)} still relevant?`,
    body: pr => `<p style="margin:0">Claude works out what <b>${esc(pr.title)}</b> was for and checks it against today's <code>${esc(pr.base)}</code>.</p>
       <p style="margin:0">If it was replaced or no longer matters, <b>Claude closes the PR</b> (no comment, branch kept; you can reopen it). If it is still needed, Claude rescues it: merges <code>${esc(pr.base)}</code>, resolves conflicts, fixes CI and pushes.</p>`,
    go: 'Check it' } },
  address: { run: 'task', note: ADDRESS, writes: true },
  // Someone else's PR: Claude reviews it without changing it, then approves or requests changes from your account.
  // The server says when (approvable): not once you approved, until someone asks for your review again.
  approve: { menu: 'Thermo review, then approve…', run: 'approve', writes: true, when: pr => pr.approvable, confirm: {
    title: pr => `Thermo review ${short(pr)}, then approve?`,
    body: pr => `<p style="margin:0">Claude runs the thermo-nuclear review on <b>${esc(pr.title)}</b> by @${esc(pr.author)} without changing the PR.</p>
       <p style="margin:0">If nothing critical turns up, <b>Claude approves it from your account</b> with a short, funny comment. If something critical does, it <b>requests changes</b> and lists what to fix.</p>`,
    go: 'Review it' } },
  update: { menu: 'Update branch', gh: 'update', doing: 'Updating', did: 'Updated' },
  ready: { menu: 'Mark ready for review', gh: 'ready', when: pr => pr.isDraft, doing: 'Marking ready', did: 'Marked ready' },
  merge: { menu: 'Merge…', gh: 'merge', mine: true, doing: 'Merging', did: 'Merged', confirm: {
    title: pr => `Merge ${short(pr)}?`,
    body: pr => `<p style="margin:0">Squash-merges <b>${esc(pr.title)}</b> into <code>${esc(pr.base)}</code>. If anyone pushes to it first, GitHub refuses the merge.</p>`,
    go: 'Merge' } },
  // Opens the Merge & release dialog, which says how the PR's repo releases before anything runs.
  ship: { menu: 'Merge & release…', mine: true, ship: true, when: pr => releasable(pr.repo) },
  // Your admin rights merge past a missing approval or a branch behind its base. The server decides which
  // PRs qualify (adminMergeable) and checks again before merging; the dialog spells out what it skips.
  admin: { menu: 'Admin merge…', gh: 'admin-merge', mine: true, ship: true, when: pr => pr.adminMergeable, doing: 'Admin merging', did: 'Merged' },
  close: { menu: 'Close…', gh: 'close', mine: true, danger: true, doing: 'Closing', did: 'Closed', confirm: {
    title: pr => `Close ${short(pr)}?`,
    body: pr => `<p style="margin:0">Closes <b>${esc(pr.title)}</b> without merging. You can reopen it on GitHub.</p>`,
    go: 'Close PR' } },
}
const can = (v, pr, mine) => { const V = VERBS[v]; return (!V.writes || pr.writable) && (!V.mine || mine) && (!V.when || V.when(pr)) }

// One model per bucket: the server decides each PR's lane; the bucket says what you can do with it.
// `action` is [label, verb] for the row's primary button; `bulk` runs its verb on the whole bucket; `theirs`
// marks the lanes that hold other people's PRs.
const LANES = [
  { id: 'ready', label: 'Ready to merge', hint: 'Mergeable, nothing GitHub requires is missing.', dot: 'var(--ok)',
    action: ['Merge', 'merge'], bulk: { label: 'Merge all', verb: 'merge' } },
  { id: 'waiting', label: 'Waiting on you', hint: 'Someone asked for your review.', dot: 'var(--info)', theirs: true,
    action: ['Review with Claude', 'review'], bulk: { label: 'Review all with Claude', verb: 'review' } },
  { id: 'reviewed', label: 'Reviewed by you', hint: 'You reviewed it; it stays here until it is merged or closed.', dot: 'var(--reviewed)', theirs: true },
  { id: 'fix', label: 'Fix CI', hint: 'A required check failed. Claude reads the log and fixes it.', dot: 'var(--bad)',
    action: ['Fix CI with Claude', 'fix'], bulk: { label: 'Fix all with Claude', verb: 'fix' },
    quick: [['CI is failing here, fix it', true], ['Is this failure caused by my PR or by main?', false]] },
  { id: 'changes', label: 'Changes requested', hint: 'A reviewer asked for changes.', dot: 'var(--bad)',
    action: ['Address with Claude', 'address'],
    quick: [['Address the review comments', true], ['Summarise what the reviewers asked for', false]] },
  { id: 'behind', label: 'Update branch', hint: 'Green, but behind its base.', dot: 'var(--warn)',
    action: ['Update branch', 'update'], bulk: { label: 'Update all', verb: 'update' } },
  { id: 'conflict', label: 'Resolve conflicts', hint: 'Conflicts with its base branch.', dot: 'var(--warn)',
    action: ['Resolve with Claude', 'rebase'], bulk: { label: 'Rebase all with Claude', verb: 'rebase' },
    quick: [['Rebase onto main and fix the conflicts', true], ['Summarise what conflicts with main', false]] },
  { id: 'review', label: 'Needs approval', hint: 'Waiting for a reviewer or another merge rule.', dot: 'var(--approval)' },
  { id: 'checking', label: 'CI running', hint: 'Checks are running, GitHub is still working out mergeability, or no check has reported yet.', dot: 'var(--sub)' },
  { id: 'draft', label: 'Drafts', hint: 'Yours, not marked ready.', dot: 'var(--mute)',
    action: ['Mark ready', 'ready'] },
  { id: 'stale', label: 'Close or revive', hint: 'Stuck for a week or more.', dot: 'var(--stale)',
    action: ['Still relevant?', 'relevance'], bulk: { label: 'Check all with Claude', verb: 'relevance' } },
]
const LANE = Object.fromEntries(LANES.map(l => [l.id, l]))
// Per run kind: what a PR's row says while the run works on it, and what it calls a finished one.
const KIND = { fix: ['Fixing CI', 'Fix CI'], rebase: ['Rebasing', 'Rebase'], review: ['Review started', 'Review'], thermo: ['Reviewing code', 'Thermo review'], resolve: ['Resolving, then reviewing', 'Resolve & review'], approve: ['Reviewing, then approving', 'Thermo & approve'],
  relevance: ['Checking relevance', 'Relevance check'], ask: ['Claude working', 'Claude request'], task: ['Claude working', 'Claude request'] }
const RUN_DOT = { done: 'var(--ok)', running: 'var(--info)', queued: 'var(--info)', failed: 'var(--bad)', stopped: 'var(--mute)', interrupted: 'var(--mute)' }
// Retry starts a run of the same kind fresh from the PR, so a run whose directory is gone gets today's worktree.
// A request in your own words has no kind to start again from, so it resumes its run.
const resumes = r => r.kind === 'ask' || r.kind === 'task'

// Per-viewer preferences; storage can be missing (private window) and the page works without it.
const recall = key => { try { return localStorage.getItem(`pr-inbox:${key}`) } catch { return null } }
const remember = (key, value) => { try { localStorage.setItem(`pr-inbox:${key}`, value) } catch {} }

const S = {
  inApp: new URLSearchParams(location.search).has('app'),
  data: null, runs: [], health: null, loading: false, error: null,
  // How each of your repos releases (from /api/releases), why one could not be checked, and releases in flight.
  plans: {}, planErrors: {}, releasing: {},
  group: recall('group') === 'repo' ? 'repo' : 'lane', show: recall('show') === 'needs' ? 'needs' : 'all', sorts: {}, lane: 'all', summaryOpen: false, menu: null, dialog: null, openRun: null, logOpen: {}, fullLog: {}, flash: null,
  // The PRs whose runs show as cards under the row instead of the newest one on a line.
  runsOpen: {},
  // The PR open in the side panel, by key, and each PR's full detail as fetched, by URL.
  detail: null, details: {},
  // The PRs open as tabs in the panel, in order; which view the panel shows; each PR's changed files, by URL.
  tabs: [], view: 'summary', files: {},
  // The search box, the people each repo can ask to review, whether the picker is open, and comment drafts by URL.
  query: '', people: {}, picking: false, comments: {}, posting: false,
  drafts: {}, busy: {}, done: {}, bulkBusy: {}, replyOpen: {}, replyDrafts: {},
  // The PRs you ticked, by key, for the bar on top to merge, or merge and release.
  picked: new Set(),
  // Motion bookkeeping: what has already been on screen, so a re-render never replays an entrance.
  seen: new Set(), heroKey: null,
}

// True the first time `key` comes up, false every time after.
function first(key) {
  if (S.seen.has(key)) return false
  S.seen.add(key)
  return true
}

// After a render: elements whose data-enter key is new rise in, staggered in document order; elements
// already seen stay still, so a re-render never replays an entrance.
function animateNew(root) {
  let i = 0
  for (const el of [root, ...root.querySelectorAll('[data-enter]')]) {
    if (!el.dataset.enter || !first(el.dataset.enter)) continue
    el.classList.add('enter')
    el.style.setProperty('--i', Math.min(i++, 14))
  }
}

const $ = sel => document.querySelector(sel)
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
const httpsOnly = url => /^https:\/\//.test(url || '') ? url : null
const keyOf = pr => `${pr.repo}#${pr.number}`
const short = pr => `${pr.name}#${pr.number}`
const days = iso => Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / DAY))
const age = pr => days(pr.createdAt) === 0 ? 'today' : `${days(pr.createdAt)}d`
const tilde = path => path.replace(/^\/Users\/[^/]+/, '~')
const active = r => r.status === 'running' || r.status === 'queued'
const inline = text => esc(text)
  .replace(/\[([^\]\n]+)\]\((https:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>')
  .replace(/`([^`\n]+)`/g, '<code>$1</code>')
  .replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>')
// A one-line plain version of Claude's markdown: no emphasis, code ticks, headings, list markers or link syntax.
const plain = text => text.replace(/\[([^\]\n]+)\]\([^)\s]+\)/g, '$1').replace(/\*\*/g, '').replace(/`/g, '').replace(/^\s*(#+|[-*•]|\d+\.)\s+/, '').trim()
const firstLine = text => plain(String(text || '').split('\n').find(l => l.trim()) || '')
function ago(ms) {
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000))
  return s < 45 ? 'just now' : s < 3600 ? `${Math.round(s / 60)}m ago` : s < 86400 ? `${Math.round(s / 3600)}h ago` : `${Math.round(s / 86400)}d ago`
}
function dur(ms) {
  const s = Math.max(0, Math.round(ms / 1000))
  return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`
}

// Every API call carries the header the server requires: other sites cannot add it without a preflight.
async function api(path, body) {
  const headers = { 'x-pr-inbox': '1' }
  const opts = body === undefined ? { headers } : { method: 'POST', headers: { ...headers, 'content-type': 'application/json' }, body: JSON.stringify(body) }
  const res = await fetch(path, opts)
  const json = await res.json().catch(() => ({}))
  if (!res.ok) throw new Error(json.error || `Request failed (${res.status})`)
  return json
}

// `href`: a link the toast offers (a release it made), which keeps it up longer.
function toast(text, isErr = false, href = null) {
  const el = Object.assign(document.createElement('div'), { className: 'toast' + (isErr ? ' err' : ''), textContent: text })
  if (httpsOnly(href)) el.append(Object.assign(document.createElement('a'), { href, target: '_blank', rel: 'noreferrer', textContent: 'Open' }))
  $('#toasts').append(el)
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 260) }, href ? 12000 : isErr ? 7000 : 4000)
}

// innerHTML re-renders drop focus: put the caret (or the selection) back in the field you were typing in.
function keepFocus(render) {
  const el = document.activeElement
  const id = el?.id && el.matches('textarea, input') ? el.id : null
  const [start, end] = id ? [el.selectionStart, el.selectionEnd] : [0, 0]
  render()
  const again = id && document.getElementById(id)
  if (again && again !== document.activeElement) { again.focus(); again.setSelectionRange(start, end) }
}

function focusEnd(id) {
  const el = document.getElementById(id)
  if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length) }
}

// ---------- model ----------

function allPrs() {
  return S.data ? [...S.data.mine, ...S.data.others] : []
}
// Someone else's PR you approved or asked changes on, and nobody has asked you to look at again.
const handled = pr => pr.lane === 'reviewed' && ['APPROVED', 'CHANGES_REQUESTED'].includes(pr.yourReview)
// The PRs the board lists: all of them, or with "Show: Needs me" all but the handled ones. Runs and lookups
// still see every PR.
const boardPrs = () => allPrs().filter(pr => (S.show !== 'needs' || !handled(pr)) && matches(pr, S.query))

// The search box: every word must match. repo:, author: (or @name) and label: look at that field only, #123 or a
// bare number at the PR number, and any other word anywhere in the title, repo, branch, author or labels.
function matches(pr, query) {
  const has = (field, word) => String(field).toLowerCase().includes(word)
  return query.toLowerCase().split(/\s+/).filter(Boolean).every(w => {
    const [, key, val] = w.match(/^(repo|author|label):(.*)$/) || []
    if (key === 'repo') return has(pr.repo, val)
    if (key === 'author') return has(pr.author, val)
    if (key === 'label') return pr.labels.some(l => has(l, val))
    if (w.startsWith('@')) return has(pr.author, w.slice(1))
    if (/^#?\d+$/.test(w)) return String(pr.number).startsWith(w.replace('#', ''))
    return [pr.title, pr.repo, pr.head, pr.author, ...pr.labels].some(f => has(f, w))
  })
}

const findPr = k => allPrs().find(pr => keyOf(pr) === k)
const runFor = pr => S.runs.find(r => r.prUrl === pr.url && active(r))
// A PR's runs, newest first, as the server lists them.
const runsOf = pr => S.runs.filter(r => r.prUrl === pr.url)
// The PR a run sits under on the board, while that PR is still in your inbox.
const prOf = r => r.prUrl ? allPrs().find(p => p.url === r.prUrl) : null
// The runs whose kind last failed or was cut off on this PR, and that Retry may start again: a request in your
// words resumes; any other kind restarts only while its action still applies and asks nothing first.
function retryable(pr) {
  const latest = new Map()
  for (const r of runsOf(pr)) if (!latest.has(r.kind)) latest.set(r.kind, r)
  const mine = !LANE[pr.lane].theirs
  const offered = r => resumes(r) || Object.entries(VERBS).some(([v, V]) => V.run === r.kind && !V.confirm && can(v, pr, mine))
  return [...latest.values()].filter(r => (r.status === 'failed' || r.status === 'interrupted') && offered(r))
}
// A green PR of yours whose thermo review passed has nothing left but the merge, so it leads its lane, and its
// repository's group unless that group is sorted by date.
const cleared = pr => !LANE[pr.lane].theirs && pr.ci === 'pass' && review(pr).state === 'pass'
const newestFirst = (a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt)
const lanePrs = id => boardPrs().filter(pr => pr.lane === id).sort((a, b) => cleared(b) - cleared(a) || newestFirst(a, b))
// Each repository group keeps its own order: 'ready' (cleared PRs first) or 'date'.
const sortOf = repo => S.sorts[repo] ??= recall(`sort:${repo}`) === 'date' ? 'date' : 'ready'
// A finished gh action keeps its row dimmed with a check for two minutes, then the row follows GitHub again.
const doneFor = k => S.done[k] && Date.now() - S.done[k].at < 120000 ? S.done[k].label : null
const idle = pr => !doneFor(keyOf(pr)) && !runFor(pr) && !S.busy[keyOf(pr)]
// The PRs a bucket's bulk action would take: idle, and offered that action on their own row.
const actionable = id => lanePrs(id).filter(pr => idle(pr) && (!LANE[id].bulk || can(LANE[id].bulk.verb, pr, !LANE[id].theirs)))
const repoName = repo => repo.split('/').pop()
const releasable = repo => ['tag', 'workflow'].includes(S.plans[repo]?.method)
// Your idle Ready PRs that Merge & release can take: in `repo`, or in every repo that releases.
const shippable = repo => lanePrs('ready').filter(pr => (!repo || pr.repo === repo) && idle(pr) && can('ship', pr, true))
const mergeable = repo => lanePrs('ready').filter(pr => pr.repo === repo && idle(pr) && can('merge', pr, true))
// Your idle PRs a tick can take: a Ready one merges the normal way, and one held back only by its approval or by
// being behind takes an admin merge.
const pickable = pr => !LANE[pr.lane].theirs && idle(pr) && (pr.lane === 'ready' && can('merge', pr, true) || can('admin', pr, true))
// The ticked PRs (or just `from`) that are still pickable, split the way the Merge & release dialog takes them.
function picks(from = [...S.picked].map(findPr)) {
  const prs = from.filter(pr => pr && pickable(pr))
  return { prs, keys: prs.filter(pr => pr.lane === 'ready').map(keyOf), admin: prs.filter(pr => pr.lane !== 'ready').map(keyOf) }
}
// Why GitHub would not merge a PR yet, in a few words: what keeps it out of Merge & release.
function blockers(pr) {
  const out = []
  if (pr.isDraft) out.push('draft')
  if (pr.ci === 'fail' && pr.mergeState !== 'UNSTABLE') out.push('CI failing')
  else if (pr.ci === 'running') out.push('CI running')
  if (pr.mergeable === 'CONFLICTING') out.push('has conflicts')
  if (pr.mergeState === 'BEHIND') out.push(`behind ${pr.base}`)
  if (pr.review === 'REVIEW_REQUIRED') out.push('needs approval')
  if (pr.review === 'CHANGES_REQUESTED') out.push('changes requested')
  return out.length ? out.join(', ') : LANE[pr.lane].label.toLowerCase()
}
// Your open PRs in `repo` that a release would not take, because they are not Ready to merge.
const leftOut = repo => S.data.mine.filter(pr => pr.repo === repo && pr.lane !== 'ready')
const leftOutText = prs => prs.map(pr => `#${pr.number} (${pr.lane === 'ready' ? 'ready, not in this batch' : blockers(pr)}${pr.adminMergeable ? '; admin merge possible' : ''})`).join(', ')
// What Claude said last in a run: its result, or the error it ended on.
const lastSaid = r => r.events.findLast(e => e.kind === 'result' || e.kind === 'error')

// ---------- header and notices ----------

function renderHeader() {
  const items = boardPrs()
  $('#who').textContent = S.data ? `@${S.data.login} · ${items.length} open across ${plural(new Set(items.map(pr => pr.repo)).size, 'repo')}` : ''
  $('#refresh-btn').classList.toggle('spinning', S.loading)
  $('#updated').innerHTML = S.loading ? '<span class="spin" aria-label="Refreshing"></span>Refreshing' : S.data ? `Updated ${ago(S.data.fetchedAt)}` : ''
  const pills = [{ id: 'all', label: 'All', n: items.length }]
    .concat(LANES.map(l => ({ ...l, n: items.filter(p => p.lane === l.id).length })).filter(l => l.n))
  // A bucket that emptied takes its filter with it, so the board never looks empty behind a hidden filter.
  if (S.data && !pills.some(p => p.id === S.lane)) S.lane = 'all'
  const show = choose('show', S.show, 'Which pull requests to show', 'Show', [
    ['all', 'Everyone', 'Every PR in your inbox (N)'],
    ['needs', 'Needs me', 'Hides PRs you already approved or asked changes on, until someone asks for your review again (N)'],
  ])
  const group = choose('group', S.group, 'Group pull requests', 'Group by', [['lane', 'Status', 'Group by status (G)'], ['repo', 'Repository', 'Group by repository (G)']])
  const pillsHtml = pills.map(f => `<button class="pill" data-act="filter" data-lane="${f.id}" aria-pressed="${S.lane === f.id}">${f.dot ? `<span class="dot" style="--dot:${f.dot}"></span>` : ''}${esc(f.label)}<span class="n">${f.n}</span></button>`).join('')
  $('#filters').innerHTML = `<div class="pills">${pillsHtml}</div><div class="views">${show}${group}</div>`
}

// A two-way switch: `act` names both the handler and the data attribute that carries the choice.
function choose(act, now, aria, label, options, attrs = '') {
  return `<div class="group-by" role="group" aria-label="${aria}"><span class="sub">${label}</span>${options
    .map(([id, text, tip]) => `<button class="btn btn-sm${now === id ? '' : ' btn-ghost'}" data-act="${act}" data-${act}="${id}" ${attrs} aria-pressed="${now === id}" title="${tip}">${text}</button>`).join('')}</div>`
}

function renderNotice() {
  const h = S.health
  const box = (title, detail = '', buttons = '') => `<div class="wrap notice"><div class="notice-box" role="status">${icon('alert')}<div class="notice-text"><strong>${title}</strong> <span class="sub">${detail}</span></div>${buttons}</div></div>`
  const recheck = '<button class="btn btn-sm btn-ghost" data-act="recheck">I\'ve signed in</button>'
  $('#notice').innerHTML =
    h && !h.gh.ok ? box('The GitHub CLI cannot reach GitHub, so PRs cannot load.', esc(h.gh.error || 'gh is missing or signed out'), `<button class="btn btn-sm btn-primary" data-act="login" data-tool="gh">Sign in to GitHub</button>${recheck}`)
    : S.error ? box('Could not load pull requests.', esc(S.error), '<button class="btn btn-sm" data-act="refresh">Try again</button>')
    : h && !h.claude.installed ? box('The <code>claude</code> command was not found.', 'Claude runs cannot start.')
    : h && !h.claude.loggedIn ? box('Claude is signed out on this Mac.', 'Claude runs cannot start.', `<button class="btn btn-sm btn-primary" data-act="login" data-tool="claude">Sign in</button>${recheck}`)
    : S.data?.warning ? box('Some PRs could not be loaded.', esc(S.data.warning))
    : ''
}

// ---------- Claude's triage ----------

function summaryHtml(lines) {
  let out = '', gap = false
  for (const raw of lines) {
    const line = raw.trim()
    if (!line) { if (out && !gap) out += '<div class="gap"></div>'; gap = true; continue }
    gap = false
    if (/^\*\*[^*]+\*\*:?$/.test(line) || /^#+\s/.test(line)) out += `<div class="sec">${esc(plain(line).replace(/:$/, ''))}</div>`
    else if (/^[-*•]\s/.test(line)) out += `<div>${inline(line.replace(/^[-*•]\s+/, ''))}</div>`
    else out += `<div>${inline(line)}</div>`
  }
  return out
}

function hero() {
  const o = S.runs.find(r => r.kind === 'digest' || r.kind === 'triage')
  const key = o ? `${o.id}:${o.status}` : 'none'
  const fresh = key !== S.heroKey
  S.heroKey = key
  const card = o && S.openRun === o.id ? `<div class="hero-run">${runCard(o)}</div>` : ''
  return `<section class="hero panel${fresh ? ' enter' : ''}">${heroBody(o)}${card}</section>`
}

function heroBody(o) {
  const name = o?.kind === 'digest' ? 'Morning summary' : 'Claude’s triage'
  const kicker = (label, spinning = false) => `<div class="hero-kicker"><span class="hero-badge">${icon('sparkle')}</span><span class="hero-label">${spinning ? '<span class="spin"></span>' : ''}${esc(label)}</span></div>`
  if (!o) {
    return `${kicker(name)}<p class="hero-line">No triage yet. Claude reads every PR and tells you where to start.</p>
      <div class="hero-acts"><button class="hero-link" data-act="triage">Triage with Claude now</button><span class="hero-label">The morning summary runs at ${esc(S.health?.morning || '08:00')}.</span></div>`
  }
  if (active(o)) return `${kicker(`${name} · started ${ago(o.startedAt)}`, true)}<p class="hero-line">Claude is going through your PRs.</p>
    <div class="hero-acts"><button class="hero-link" data-act="show-run" data-run="${esc(o.id)}">Show progress</button></div>`
  const result = lastSaid(o)
  if (!result || result.kind === 'error') {
    const why = result ? `: ${firstLine(result.text)}` : ` (${o.status})`
    return `${kicker(`${name} · ${o.status} · ${ago(o.endedAt || o.startedAt)}`)}<p class="hero-line failed">The last ${o.kind === 'digest' ? 'morning summary' : 'triage'} did not finish${esc(why)}</p>
      <div class="hero-acts"><button class="hero-link" data-act="show-run" data-run="${esc(o.id)}">See what happened</button><button class="hero-link" data-act="triage">Triage again</button></div>`
  }
  const lines = result.text.split('\n')
  const lead = lines.findIndex(l => l.trim())
  const rest = lines.slice(lead + 1)
  const more = rest.some(l => l.trim())
  const detail = S.summaryOpen && more ? `<div class="hero-detail">${summaryHtml(rest)}</div>` : ''
  const toggle = more ? `<button class="hero-link" data-act="toggle-summary" aria-expanded="${S.summaryOpen}">${S.summaryOpen ? 'Hide details' : 'Show full triage'}${icon('chevron', 14)}</button>` : ''
  return `${kicker(`${name} · ${ago(o.endedAt || o.startedAt)}`)}<p class="hero-line">${esc(plain(lines[lead]))}</p>${detail}<div class="hero-acts">${toggle}</div>`
}

// ---------- buckets ----------

// `byRepo`: no lane heading above the row says it is ready, waiting on you or reviewed by you, so a tag does.
function tags(pr, lane, byRepo) {
  const out = []
  const tag = (label, cls, title = '') => out.push(`<span class="tag ${cls}"${title ? ` title="${esc(title)}"` : ''}>${label}</span>`)
  if (byRepo && lane.id === 'ready') tag('Ready to merge', 'tag-ok')
  if (byRepo && lane.theirs) tag(lane.label, 'tag-info')
  if (pr.ci === 'fail' && pr.mergeState === 'UNSTABLE') tag('Optional check failing', 'tag-warn', 'GitHub does not require this check; the PR can still merge')
  else ({ pass: () => tag('CI passing', 'tag-ok'), fail: () => tag('CI failing', 'tag-bad'), running: () => tag('CI running', 'tag-mute'), none: () => tag('No checks', 'tag-mute') })[pr.ci]()
  if (pr.mergeable === 'CONFLICTING') tag('Conflicts', 'tag-bad')
  if (pr.mergeState === 'BEHIND') tag('Behind base', 'tag-warn')
  const approved = pr.yourReview === 'APPROVED'
  if (approved) tag('✓ You approved', 'tag-ok')
  if (pr.review === 'REVIEW_REQUIRED') tag(approved ? 'Needs another approval' : 'Needs approval', 'tag-mute')
  if (pr.review === 'CHANGES_REQUESTED') tag('Changes requested', 'tag-bad')
  if (pr.review === 'APPROVED') tag('Approved', 'tag-ok')
  if (pr.isDraft) tag('Draft', 'tag-mute')
  if (pr.isCrossRepo) tag('From a fork', 'tag-mute', 'Claude runs that change code are off for fork PRs')
  for (const l of pr.labels || []) tag(esc(l), 'tag-info', 'Label')
  // A thermo-nuclear review shows once one is recorded; the runs strip says when one failed to run.
  if (!lane.theirs) {
    const { state, tip } = review(pr)
    if (state !== 'none') tag(...{ outdated: ['Review outdated', 'tag-mute'], pass: ['✓ Review passed', 'tag-ok'], fail: ['✕ Review failed', 'tag-bad'] }[state], tip)
  }
  return out.join('')
}

// The thermo-nuclear review's standing comes with the PR list: the server finds the review of the PR's
// head commit, or of its branch or PR Inbox's own pr-inbox/<number> branch, and marks it outdated once the
// PR has newer commits.
function review(pr) {
  const t = S.data.thermo?.[pr.url]
  if (!t) return { state: 'none', tip: 'No thermo-nuclear review recorded for this branch' }
  const tip = `${t.summary ? t.summary + ' · ' : ''}reviewed ${t.sha.slice(0, 7)} ${ago(t.at)}`
  return { state: t.state, tip: t.state === 'outdated' ? tip + '; the PR has newer commits' : tip }
}

// What Merge & release does on a PR of `repo`, for the button's tooltip.
function shipTip(repo) {
  const p = S.plans[repo]
  return p?.method === 'tag' ? `Squash-merge, then release ${p.next} from ${p.branch}` : `Squash-merge, then run ${repoName(repo)}'s release workflow`
}

// A PR's buttons: its lane's next step, the extras, and the menu of everything else. `menuKey` tells the row's
// menu from the panel's, so opening one never opens both.
function actsHtml(pr, lane, menuKey) {
  const k = keyOf(pr)
  const run = runFor(pr)
  const done = doneFor(k)
  const mine = !lane.theirs
  const link = (href, body) => `<a href="${esc(href)}" target="_blank" rel="noreferrer">${body}</a>`
  const verbs = vs => vs.filter(v => can(v, pr, mine)).map(v => `<button data-act="verb" data-verb="${v}"${VERBS[v].danger ? ' class="danger"' : ''}>${VERBS[v].menu}</button>`).join('')
  const menu = S.menu !== menuKey ? '' : `<div class="menu" role="menu">
      ${link(pr.url, 'Open on GitHub')}${link(pr.url + '/files', 'View changes')}<div class="sep"></div>
      <button data-act="ask">Ask Claude…</button>${verbs(['fix', 'rebase', 'resolve', 'review', 'approve', 'thermo', 'relevance'])}<div class="sep"></div>
      ${verbs(['update', 'ready', 'merge', 'ship', 'admin', 'close'])}
    </div>`
  if (S.busy[k]) return `<span class="state"><span class="spin"></span>${esc(S.busy[k])}</span>`
  else if (run) return `<button class="state" data-act="show-run" data-run="${esc(run.id)}"><span class="spin"></span>${esc(KIND[run.kind]?.[0] || 'Claude working')}</button>`
  else if (done) return `<span class="state ok">${icon('check', 16, first('done:' + k) ? 'pop' : '')}${esc(done)}</span>`
  else {
    let [label, verb] = lane.action || []
    if (verb && !can(verb, pr, mine)) verb = null
    // On your own PRs the thermo-nuclear review stays one click away until the current commit has passed it.
    return `${verb ? `<button class="btn btn-primary" data-act="verb" data-verb="${verb}">${esc(label)}</button>` : ''}${extras(pr, verb, mine)}
      <button class="btn btn-ghost btn-icon" data-act="menu" data-menu="${esc(menuKey)}" title="More" aria-label="More actions" aria-expanded="${S.menu === menuKey}">${icon('more')}</button>${menu}`
  }
}

// `byRepo`: the row sits in its repository's group, so its number goes without the repo name.
function row(pr, lane, byRepo = false) {
  const k = keyOf(pr)
  const done = doneFor(k)
  const link = (href, body, cls = '') => href ? `<a class="${cls}" href="${esc(href)}" target="_blank" rel="noreferrer">${body}</a>` : `<span class="${cls}">${body}</span>`
  const fails = pr.failing.slice(0, 4).map(c => link(httpsOnly(c.url), `✕ ${esc(c.name)}${c.cancelled ? ' (cancelled)' : ''}`)).join('')
  const mine = !lane.theirs
  const acts = actsHtml(pr, lane, k)
  const info = [
    `+${pr.additions.toLocaleString()} −${pr.deletions.toLocaleString()}`,
    plural(pr.files, 'file'),
    `<span title="Updated ${esc(ago(Date.parse(pr.updatedAt)))}">${age(pr)}</span>`,
    pr.reviewers.length ? `waiting on ${esc(pr.reviewers.map(r => '@' + r).join(', '))}` : '',
    pr.openThreads ? `<span class="threads">${plural(pr.openThreads, 'open thread')}</span>` : '',
    mine ? `<span class="branch" title="${esc(pr.head)}">${esc(pr.head)}</span>` : '',
  ].filter(Boolean).join(' · ')
  const author = mine ? '' : `<span class="author" title="Opened by @${esc(pr.author)}"><img src="https://github.com/${esc(encodeURIComponent(pr.author))}.png?size=40" alt="" loading="lazy" onerror="this.remove()">@${esc(pr.author)}</span>`
  // Your PRs that cannot merge yet keep a greyed-out tick that says why.
  const why = done || (!idle(pr) ? 'Something is running on it' : `Not ready to merge: ${blockers(pr)}`)
  const pick = !mine ? '<span class="pick" aria-hidden="true"></span>'
    : `<input type="checkbox" class="pick" data-act="pick" aria-label="Select ${esc(short(pr))}"${S.picked.has(k) ? ' checked' : ''}${pickable(pr) ? '' : ` disabled title="${esc(why)}"`}>`
  return `<article class="pr${done ? ' done' : ''}${mine ? '' : ' theirs'}${S.detail === k ? ' selected' : ''}" data-enter="pr:${esc(k)}" data-key="${esc(k)}">
    <div class="row">
      ${pick}<span class="dot" style="--dot:${lane.dot}" title="${esc(`${lane.label}. ${lane.hint}`)}"></span>
      <div class="pr-main">
        <div class="pr-head"><a class="pr-title" href="${esc(pr.url)}" data-act="detail" title="Open here (⌘-click opens GitHub)">${esc(pr.title)}</a><span class="pr-num">${byRepo ? '' : link(`https://github.com/${pr.repo}`, esc(pr.name))}#${pr.number}</span>${author}</div>
        <div class="pr-meta">${tags(pr, lane, byRepo)}<span class="dim">${info}</span></div>
        ${fails ? `<div class="fails">${fails}</div>` : ''}
      </div>
      <div class="pr-acts">${acts}</div>
    </div>
    ${strip(pr)}
  </article>`
}

// The buttons beside the lane's own action: one of merge and release, resolve and review, an admin merge, the
// review-then-approve of someone else's PR or the relevance check, whichever this PR can take (else its GitHub
// page), then the thermo-nuclear review until the current commit has passed it. Every other action is in the menu.
function extras(pr, verb, mine) {
  const button = (v, body, tip) => `<button class="btn" data-act="verb" data-verb="${v}" title="${esc(tip)}">${body}</button>`
  const one = verb === 'merge' && can('ship', pr, mine) ? button('ship', `${icon('rocket', 14)}Merge &amp; release`, shipTip(pr.repo))
    : can('resolve', pr, mine) ? button('resolve', `${icon('sparkle', 14)}Resolve &amp; review`, `One Claude run: merge ${pr.base} and resolve the conflicts, push, then run the thermo-nuclear review on the result. It stops before the review if the conflicts need you.`)
    : can('admin', pr, mine) ? button('admin', `${icon('shield', 14)}Admin merge${releasable(pr.repo) ? ' &amp; release' : ''}`, 'Merge with your admin rights, past the missing approval or the out-of-date branch. You confirm first.')
    : can('approve', pr, mine) ? button('approve', `${icon('sparkle', 14)}Thermo &amp; approve`, `Thermo-nuclear review without changing the PR, then approve with a funny comment, or request changes if something is critical. You confirm first.`)
    : verb !== 'relevance' && can('relevance', pr, mine) ? button('relevance', 'Still relevant?', `Claude checks it against today's ${pr.base}: closes it if it no longer matters, rescues it if it does`)
    : `<a class="btn" href="${esc(pr.url)}" target="_blank" rel="noreferrer">Open on GitHub</a>`
  const thermo = can('thermo', pr, mine) ? button('thermo', `${icon('sparkle', 14)}Thermo review`, "Run the thermo-nuclear review on this PR's branch") : ''
  return one + thermo
}

const runName = r => KIND[r.kind]?.[1] || 'Claude run'

// The PR's Claude runs under its row, and only this PR's: folded, the newest on one line with how it ended;
// unfolded, a card per run with its output, log and actions. Retry starts again each kind whose last run failed.
function strip(pr) {
  const runs = runsOf(pr)
  if (!runs.length) return '<div class="strip"><span class="dim">No runs yet</span></div>'
  const open = !!S.runsOpen[keyOf(pr)]
  const again = idle(pr) ? retryable(pr) : []
  const retry = again.length ? `<button class="btn btn-sm btn-ghost" data-act="retry-all" title="Start ${esc(again.map(runName).join(', '))} again">${again.length > 1 ? 'Retry all' : 'Retry'}</button>` : ''
  const toggle = `<button class="btn btn-sm btn-ghost strip-toggle" data-act="runs-toggle" aria-expanded="${open}">${icon('chevron', 14)}<b>${plural(runs.length, 'run')}</b></button>`
  if (open) return `<div class="strip">${toggle}${retry}</div><div class="strip-runs">${runs.map(runCard).join('')}</div>`
  const r = runs[0]
  const text = active(r) ? `${KIND[r.kind]?.[0] || 'Claude working'} · started ${ago(r.startedAt)}` : `${runName(r)} ${r.status} ${ago(r.endedAt || r.startedAt)}`
  return `<div class="strip">${toggle}<button class="chip${active(r) ? ' working' : ''}" data-act="show-run" data-run="${esc(r.id)}" title="${esc(r.title)}"><span class="dot" style="--dot:${RUN_DOT[r.status] || 'var(--mute)'}"></span><span class="t">${esc(text)}</span></button>${retry}</div>`
}

// Run cards live on the board, so a redraw keeps the reply you are typing and where each log was scrolled.
function renderBoard() {
  const board = $('#board')
  renderPicked()
  renderDetail()
  keepFocus(() => {
    const scroll = saveScroll(board)
    board.innerHTML = hero() + boardBody()
    mixed(board)
    animateNew(board)
    restoreScroll(board, scroll)
  })
}

// The bar under the filters while any PR on the board can be ticked: a select-all tick, and what the ticks can
// do. A tick whose PR merged, moved lanes or got busy goes with it.
function renderPicked() {
  const { prs, admin } = picks()
  S.picked = new Set(prs.map(keyOf))
  const el = $('#picked')
  const shown = boardPrs().filter(pr => S.lane === 'all' || pr.lane === S.lane)
  const offered = shown.filter(pickable).length
  if (!prs.length && !offered) { el.innerHTML = ''; return }
  const appear = !el.firstChild
  const n = prs.length
  const repos = [...new Set(prs.map(pr => pr.repo))]
  const detail = () => [repos.length > 1 ? `in ${plural(repos.length, 'repo')}` : `in ${esc(repoName(repos[0]))}`, admin.length ? `${admin.length} by admin merge` : ''].filter(Boolean).join(' · ')
  const what = n ? `<b>${plural(n, 'PR')} selected</b> <span class="sub">${detail()}</span>` : `Select all ${offered} that can merge`
  el.innerHTML = `<div class="pick-bar${appear ? ' anim' : ''}" role="region" aria-label="Selected pull requests">
    <label class="check">${pickAll(shown)}<span>${what}</span></label><div class="grow"></div>
    ${n ? '<button class="btn btn-sm btn-ghost" data-act="pick-clear" title="Untick all (Esc)">Clear</button>' : ''}${goButtons(prs)}
  </div>`
  mixed(el)
}

// Merge and Merge & release for the ticked `prs`, greyed out while there are none. `scoped`: the buttons sit in a
// group's heading and take only its ticks; the bar's take every tick.
function goButtons(prs, scoped = false) {
  const n = prs.length
  const releases = [...new Set(prs.map(pr => pr.repo))].filter(releasable)
  const tip = !n ? 'Tick the PRs to merge first' : releases.length ? `Squash-merge, then release ${releases.map(repoName).join(', ')}` : 'None of these repos releases, so they can only merge'
  const attrs = scoped ? ` data-keys="${esc(JSON.stringify(prs.map(keyOf)))}"` : ''
  return `<button class="btn btn-sm" data-act="pick-go" data-release="false"${attrs} title="${n ? 'Squash-merge, no release' : esc(tip)}"${n ? '' : ' disabled'}>Merge${n ? ' ' + n : ''}</button>
    <button class="btn btn-sm btn-primary" data-act="pick-go" data-release="true"${attrs} title="${esc(tip)}"${releases.length ? '' : ' disabled'}>${icon('rocket', 14)}Merge &amp; release${n ? ' ' + n : ''}</button>`
}

// A group's ticked PRs; once there are any, its heading trades its own buttons for goButtons over them.
const tickedIn = prs => prs.filter(pr => S.picked.has(keyOf(pr)))

// HTML has no attribute for a half-ticked box, so the select-all ticks get theirs after each render.
const mixed = root => root.querySelectorAll('[data-mixed]').forEach(el => { el.indeterminate = true })

function boardBody() {
  if (!S.data) return S.error ? '' : '<div class="panel"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>'
  const buckets = S.group === 'repo' ? repoBuckets() : laneBuckets()
  return buckets || `<div class="panel empty">${S.query.trim() ? `No pull request matches “${esc(S.query.trim())}”.` : S.data.mine.length ? 'Nothing in this bucket right now.' : 'You have no open pull requests.'}</div>`
}

// The tick in a group's heading: it ticks every PR of the group a tick can take, and unticks them once all are.
function pickAll(prs) {
  const keys = prs.filter(pickable).map(keyOf)
  if (!keys.length) return '<span class="pick" aria-hidden="true"></span>'
  const n = keys.filter(k => S.picked.has(k)).length
  const tip = n === keys.length ? 'Untick all' : `Tick all ${keys.length} that can merge`
  return `<input type="checkbox" class="pick" data-act="pick-all" data-keys="${esc(JSON.stringify(keys))}" aria-label="${tip}" title="${tip}"${n === keys.length ? ' checked' : n ? ' data-mixed' : ''}>`
}

function laneBuckets() {
  return LANES.filter(l => S.lane === 'all' || S.lane === l.id).map(l => {
    const list = lanePrs(l.id)
    if (!list.length) return ''
    const open = actionable(l.id)
    const busy = S.bulkBusy[l.id]
    const bulk = l.bulk && open.length > 1 && !busy ? `<button class="btn btn-sm" data-act="bulk-open" data-lane="${l.id}">${esc(l.bulk.label)} ${open.length}</button>` : ''
    const ship = l.id === 'ready' && !busy && shippable().length > 1 ? `<button class="btn btn-sm btn-primary" data-act="ship-open">${icon('rocket', 14)}Merge &amp; release ${shippable().length}</button>` : ''
    const ticked = tickedIn(list)
    return `<section class="group" data-enter="lane:${l.id}" id="lane-${l.id}">
      <div class="group-head">${pickAll(list)}<span class="dot" style="--dot:${l.dot}"></span><h2>${esc(l.label)}</h2><span class="sub">${plural(list.length, 'PR')} · ${esc(l.hint)}</span><div class="grow"></div><div class="head-acts">${ticked.length ? goButtons(ticked, true) : bulk + ship}</div></div>
      <div class="panel">${list.map(pr => row(pr, l)).join('')}</div>
    </section>`
  }).join('')
}

// One group per repository, A to Z, so you can plan each repo's release. "Ready first" puts its cleared PRs on
// top and the rest in lane order; "Date" lists them newest first.
function repoBuckets() {
  const order = Object.fromEntries(LANES.map((l, i) => [l.id, i]))
  const shown = boardPrs().filter(pr => S.lane === 'all' || pr.lane === S.lane)
  const repos = [...new Set(shown.map(pr => pr.repo))].sort((a, b) => repoName(a).localeCompare(repoName(b)) || a.localeCompare(b))
  return repos.map(repo => {
    const ready = sortOf(repo) === 'ready'
    const list = shown.filter(pr => pr.repo === repo).sort((a, b) => (ready && (cleared(b) - cleared(a) || order[a.lane] - order[b.lane])) || newestFirst(a, b))
    // A ticked PR goes out with Merge & release, so the note leaves it out.
    const out = releasable(repo) ? leftOut(repo).filter(pr => !S.picked.has(keyOf(pr))) : []
    const ticked = tickedIn(list)
    const sort = choose('sort', sortOf(repo), `Sort ${esc(repoName(repo))} pull requests`, 'Sort', [
      ['ready', 'Ready first', 'Green PRs whose review passed on top, then the rest by status'],
      ['date', 'Date', 'Newest first'],
    ], `data-repo="${esc(repo)}"`)
    return `<section class="group" data-enter="${esc(`repo:${repo}`)}">
      <div class="group-head">${pickAll(list)}<h2><a href="https://github.com/${esc(repo)}" target="_blank" rel="noreferrer">${esc(repoName(repo))}</a></h2><span class="sub">${[`${list.length} open`, ...releaseInfo(repo)].join(' · ')}</span><div class="grow"></div><div class="head-acts">${sort}${ticked.length ? goButtons(ticked, true) : repoActions(repo)}</div></div>
      ${out.length ? `<div class="group-note">Not in the next release: ${esc(leftOutText(out))}</div>` : ''}
      <div class="panel">${list.map(pr => row(pr, LANE[pr.lane], true)).join('')}</div>
    </section>`
  }).join('')
}

function repoActions(repo) {
  if (S.releasing[repo]) return '<span class="state"><span class="spin"></span>Releasing</span>'
  const merge = mergeable(repo)
  const ship = shippable(repo)
  const p = S.plans[repo]
  const repoAttr = `data-repo="${esc(repo)}"`
  const out = merge.length > 1 ? [`<button class="btn btn-sm" data-act="merge-repo" ${repoAttr}>Merge ${merge.length}</button>`] : []
  if (ship.length) out.push(`<button class="btn btn-sm btn-primary" data-act="ship-open" ${repoAttr}>${icon('rocket', 14)}Merge &amp; release ${ship.length}</button>`)
  else if (releasable(repo) && p.unreleased > 0) {
    const tip = `Releases the ${plural(p.unreleased, 'commit')} already on ${p.branch}. It merges nothing: open PRs join once they are Ready to merge.`
    out.push(`<button class="btn btn-sm btn-ghost" data-act="release-open" ${repoAttr} title="${esc(tip)}">${icon('rocket', 14)}Release${p.next ? ' ' + esc(p.next) : ''}</button>`)
  }
  return out.join('')
}

// The repo's release standing for its heading: the next and latest tag (or its workflow), and the commits its
// branch holds unreleased, linked to GitHub's comparison.
function releaseInfo(repo) {
  if (!S.data.mine.some(pr => pr.repo === repo)) return []
  const p = S.plans[repo]
  const ver = v => `<span class="ver">${esc(v)}</span>`
  if (!p) return [S.planErrors[repo] ? `<span title="${esc(S.planErrors[repo])}">could not check how it releases</span>` : 'checking how it releases…']
  if (p.method === 'none') return ['no releases yet, so it only merges']
  const out = p.method === 'tag' ? [p.next ? `next ${ver(p.next)}` : '', `latest ${ver(p.latest)}`] : [`releases with ${ver('release.yml')}`, p.latest ? `latest ${ver(p.latest)}` : '']
  const commits = `${plural(p.unreleased || 0, 'commit')} unreleased`
  if (p.unreleased && p.latest) out.push(`<a href="https://github.com/${esc(repo)}/compare/${esc(encodeURI(p.latest))}...${esc(encodeURI(p.branch))}" target="_blank" rel="noreferrer">${commits}</a>`)
  else if (p.unreleased) out.push(commits)
  else if (p.unreleased === 0) out.push(`${esc(p.branch)} fully released`)
  return out.filter(Boolean)
}

// ---------- the PR panel ----------

// The panel's top (title, people, buttons, state) redraws with the board; its body (description, checks,
// activity) only when its detail arrives, so images do not reload and folds stay as you left them.
function renderDetail() {
  const el = $('#detail')
  const pr = S.detail ? findPr(S.detail) : null
  // A PR that left the inbox takes its tab with it.
  if (S.data) S.tabs = S.tabs.filter(findPr)
  if (S.detail && !pr && S.data) S.detail = S.tabs.at(-1) || null
  if (S.detail && !pr) return renderDetail()
  document.body.classList.toggle('has-detail', !!pr)
  if (!pr) { el.hidden = true; el.innerHTML = ''; delete el.dataset.key; return }
  // The panel slides in when it opens; moving to another PR swaps its contents in place.
  if (el.hidden) el.classList.add('anim')
  el.hidden = false
  if (el.dataset.key !== S.detail) {
    el.dataset.key = S.detail
