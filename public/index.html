    el.innerHTML = '<div class="detail-head" id="detail-head"></div><div class="detail-body" id="detail-body"></div>'
    el.scrollTop = 0
  }
  keepFocus(() => { $('#detail-head').innerHTML = detailHead(pr) })
  const d = S.view === 'code' ? S.files[pr.url] : S.details[pr.url]
  const sig = JSON.stringify([S.view, pr.url, d?.at, d?.error, !!d?.data, S.picking, S.posting, S.people[pr.repo]?.length])
  const body = $('#detail-body')
  if (body.dataset.sig !== sig) {
    body.dataset.sig = sig
    keepFocus(() => { body.innerHTML = S.view === 'code' ? codeBody(pr, d) : detailBody(pr, d) })
  }
}

function detailHead(pr) {
  const lane = LANE[pr.lane]
  const k = keyOf(pr)
  const avatar = `<img src="https://github.com/${esc(encodeURIComponent(pr.author))}.png?size=40" alt="" loading="lazy" onerror="this.remove()">`
  const fails = pr.failing.slice(0, 6).map(c => httpsOnly(c.url) ? `<a href="${esc(c.url)}" target="_blank" rel="noreferrer">✕ ${esc(c.name)}</a>` : `<span>✕ ${esc(c.name)}</span>`).join('')
  const tabs = S.tabs.length > 1 ? `<div class="ptabs" role="tablist">${S.tabs.map(t => {
    const p = findPr(t)
    return `<button class="ptab" role="tab" data-act="tab" data-key="${esc(t)}" aria-current="${t === k}" title="${esc(`${short(p)} ${p.title}`)}"><span class="t">#${p.number} ${esc(p.title)}</span><span class="x" data-act="tab-close" data-key="${esc(t)}" aria-label="Close tab">${icon('x', 12)}</span></button>`
  }).join('')}</div>` : ''
  const checkout = `gh pr checkout ${pr.number}`
  const coMenu = S.menu !== 'checkout:' + k ? '' : `<div class="menu" role="menu">
      <button data-act="checkout">Open in Terminal, in ~/…/${esc(pr.name)}</button>
      <button data-act="copy" data-text="${esc(checkout)}">Copy <code>${esc(checkout)}</code></button>
    </div>`
  const nFiles = S.files[pr.url]?.data?.length ?? pr.files
  return `${tabs}<div class="detail-bar">
      <span class="dot" style="--dot:${lane.dot}" title="${esc(lane.hint)}"></span><span class="sub">${esc(lane.label)}</span>
      <span class="pr-num"><a href="https://github.com/${esc(pr.repo)}" target="_blank" rel="noreferrer">${esc(pr.repo)}</a> <a href="${esc(pr.url)}" target="_blank" rel="noreferrer">#${pr.number}</a></span>
      <div class="grow"></div>
      <span class="anchor-wrap"><button class="btn btn-sm btn-ghost" data-act="menu" data-menu="checkout:${esc(k)}" aria-expanded="${S.menu === 'checkout:' + k}" title="${esc(checkout)}">Check out${icon('chevron', 14)}</button>${coMenu}</span>
      <a class="btn btn-sm btn-ghost" href="${esc(pr.url)}" target="_blank" rel="noreferrer">${icon('external', 14)}GitHub</a>
      <button class="btn btn-ghost btn-icon" data-act="detail-close" title="Close (Esc)" aria-label="Close">${icon('x')}</button>
    </div>
    <h2 class="detail-title">${esc(pr.title)}</h2>
    <div class="detail-sub"><span>${avatar} @${esc(pr.author)}</span><span>opened ${esc(age(pr) === 'today' ? 'today' : age(pr) + ' ago')} · updated ${esc(ago(Date.parse(pr.updatedAt)))}</span>
      <span><code>${esc(pr.base)}</code> ← <code class="branch" title="${esc(pr.head)}">${esc(pr.head)}</code></span>
      <span>${plural(pr.files, 'file')} <span style="color:var(--ok-ink)">+${pr.additions.toLocaleString()}</span> <span style="color:var(--bad-ink)">−${pr.deletions.toLocaleString()}</span></span></div>
    <div class="pr-meta">${tags(pr, lane, true)}${pr.openThreads ? `<span class="threads">${plural(pr.openThreads, 'open thread')}</span>` : ''}</div>
    ${fails ? `<div class="fails">${fails}</div>` : ''}
    <div class="detail-acts">${actsHtml(pr, lane, 'detail:' + k)}</div>
    <div class="views-sw" role="tablist">${[['summary', 'Summary'], ['code', `Code · ${plural(nFiles, 'file')}`]].map(([v, label]) =>
      `<button class="btn btn-sm${S.view === v ? '' : ' btn-ghost'}" role="tab" data-act="view" data-view="${v}" aria-selected="${S.view === v}">${label}</button>`).join('')}</div>`
}

function detailBody(pr, d) {
  if (d?.error && !d.data) return `<div class="notice-box">${icon('alert')}<div class="notice-text">Could not load this PR: ${esc(d.error)}</div><button class="btn btn-sm" data-act="detail-reload">Try again</button></div>`
  if (!d?.data) return '<div class="skeleton"></div><div class="skeleton" style="width:80%"></div><div class="skeleton" style="width:60%"></div>'
  const { bodyHtml, labels, timeline, checks } = d.data
  const reviewers = pr.reviewers.length ? pr.reviewers.map(r => `<span class="tag tag-mute">@${esc(r)}</span>`).join('') : '<span class="dim">None waiting</span>'
  const people = S.people[pr.repo] || []
  const picker = !S.picking ? `<button class="btn btn-sm btn-ghost" data-act="pick-reviewer" title="Ask someone to review">+ Add</button>`
    : `<div class="picker"><input class="input" id="reviewer-input" list="people-list" placeholder="${people.length ? 'GitHub user name' : 'Loading people…'}" autocomplete="off">
       <datalist id="people-list">${people.filter(p => p !== S.data.login && p !== pr.author).map(p => `<option value="${esc(p)}">`).join('')}</datalist>
       <button class="btn btn-sm btn-primary" data-act="add-reviewer">Ask</button><button class="btn btn-sm btn-ghost" data-act="pick-reviewer">Cancel</button></div>`
  const facts = `<dl class="facts">
      <dt>Waiting on</dt><dd>${reviewers}${picker}</dd>
      <dt>Labels</dt><dd>${labels.length ? labels.map(l => `<span class="tag tag-info">${esc(l)}</span>`).join('') : '<span class="dim">None</span>'}</dd>
      <dt>Checks</dt><dd>${checksHtml(checks)}</dd>
    </dl>`
  const desc = bodyHtml.trim() ? `<div class="md">${githubHtml(bodyHtml)}</div>` : '<p class="dim">No description.</p>'
  const compose = `<div class="compose"><textarea class="input" id="comment-input" data-act="comment-draft" placeholder="Comment on ${esc(short(pr))} as @${esc(S.data.login)} (⌘↵ posts)">${esc(S.comments[pr.url] || '')}</textarea>
      <div class="row-end"><button class="btn btn-sm btn-primary" data-act="comment-send"${S.posting ? ' disabled' : ''}>${S.posting ? '<span class="spin"></span>Posting' : 'Comment'}</button></div></div>`
  const activity = `<section><div class="sec-title">Activity${timeline.length ? ` · ${timeline.length}` : ''}</div><div class="entries">${timeline.map(entryHtml).join('')}</div>${compose}</section>`
  return `${facts}<section><div class="sec-title">Description</div>${desc}</section>${activity}`
}

// The Code tab: a file index, then each file's diff. Small files start open until about 1500 lines are showing.
function codeBody(pr, f) {
  if (f?.error && !f.data) return `<div class="notice-box">${icon('alert')}<div class="notice-text">Could not load the changes: ${esc(f.error)}</div><button class="btn btn-sm" data-act="detail-reload">Try again</button></div>`
  if (!f?.data) return '<div class="skeleton"></div><div class="skeleton" style="width:80%"></div><div class="skeleton" style="width:60%"></div>'
  const files = f.data
  const sum = (key) => files.reduce((n, x) => n + x[key], 0)
  let budget = 1500
  const STATUS = { added: 'tag-ok', removed: 'tag-bad', renamed: 'tag-info' }
  const index = files.map((x, i) => `<a href="#file-${i}" data-act="jump" data-i="${i}"><span class="nm" title="${esc(x.name)}">&lrm;${esc(x.name)}&lrm;</span><span class="add-n">+${x.additions}</span><span class="del-n">−${x.deletions}</span></a>`).join('')
  const blocks = files.map((x, i) => {
    const lines = x.patch ? x.patch.split('\n').length : 0
    const open = lines && lines <= 400 && (budget -= lines) >= 0
    const tag = STATUS[x.status] ? `<span class="tag ${STATUS[x.status]}">${esc(x.status)}</span>` : ''
    const name = x.previous && x.previous !== x.name ? `${esc(x.previous)} → ${esc(x.name)}` : esc(x.name)
    return `<details class="file" id="file-${i}"${open ? ' open' : ''}><summary>${icon('chevron', 14)}<span class="nm">${name}</span>${tag}<span class="add-n">+${x.additions}</span><span class="del-n">−${x.deletions}</span></summary>
      ${x.patch ? `<div class="diff">${diffHtml(x.patch)}</div>` : '<div class="no-patch">No diff to show: a binary file, or too large for GitHub to render.</div>'}</details>`
  }).join('')
  return `<div><div class="files-sum"><b>${plural(files.length, 'file')}</b><span class="add-n">+${sum('additions').toLocaleString()}</span><span class="del-n">−${sum('deletions').toLocaleString()}</span>
      <a href="${esc(pr.url)}/files" target="_blank" rel="noreferrer">Review on GitHub</a></div>
      <details class="fold"${files.length > 1 ? ' open' : ''}><summary>${icon('chevron', 14)}Files</summary><div class="files-index">${index}</div></details></div>
    <div class="entries">${blocks}</div>`
}

// A unified diff as rows with old and new line numbers.
function diffHtml(patch) {
  let a = 0, b = 0
  return patch.split('\n').map(line => {
    const h = line.match(/^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/)
    if (h) { a = +h[1]; b = +h[2]; return `<div class="dl hunk"><span class="ln"></span><span class="ln"></span><code>${esc(line)}</code></div>` }
    const c = line[0], text = esc(line.slice(1))
    if (c === '+') return `<div class="dl add"><span class="ln"></span><span class="ln">${b++}</span><code>${text}</code></div>`
    if (c === '-') return `<div class="dl del"><span class="ln">${a++}</span><span class="ln"></span><code>${text}</code></div>`
    if (c === '\\') return `<div class="dl note"><span class="ln"></span><span class="ln"></span><code>${text.trim()}</code></div>`
    return `<div class="dl ctx"><span class="ln">${a++}</span><span class="ln">${b++}</span><code>${text}</code></div>`
  }).join('')
}

// Failing checks first, then running, then the rest; the list folds open on its own only when one failed.
function checksHtml(checks) {
  if (!checks.length) return '<span class="dim">None reported</span>'
  const BAD = ['failure', 'timed_out', 'action_required', 'cancelled']
  const rank = c => BAD.includes(c.state) ? 0 : c.state === 'running' ? 1 : c.state === 'success' ? 3 : 2
  const sorted = [...checks].sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name))
  const n = state => checks.filter(c => state(c.state)).length
  const bad = n(s => BAD.includes(s)), running = n(s => s === 'running'), ok = n(s => s === 'success')
  const dot = s => BAD.includes(s) ? 'var(--bad)' : s === 'running' ? 'var(--info)' : s === 'success' ? 'var(--ok)' : 'var(--mute)'
  const list = sorted.map(c => `<a href="${esc(httpsOnly(c.url) || '#')}" target="_blank" rel="noreferrer"><span class="dot" style="--dot:${dot(c.state)}"></span>${esc(c.name)}<span class="dim">${esc(c.state.replace('_', ' '))}</span></a>`).join('')
  const summary = [`${ok} of ${checks.length} passing`, bad ? `<span style="color:var(--bad-ink)">${bad} failing</span>` : '', running ? `${running} running` : ''].filter(Boolean).join(' · ')
  return `<details class="fold"${bad ? ' open' : ''} style="width:100%"><summary>${icon('chevron', 14)}${summary}</summary><div class="checks">${list}</div></details>`
}

const VERDICT = { APPROVED: ['approved', 'tag-ok'], CHANGES_REQUESTED: ['requested changes', 'tag-bad'], COMMENTED: ['reviewed', 'tag-mute'], DISMISSED: ['review dismissed', 'tag-mute'] }

// A review or comment. Bots write long reports, so theirs start folded.
function entryHtml(e) {
  const [verb, cls] = VERDICT[e.state] || ['commented', '']
  const head = `<img src="https://github.com/${esc(encodeURIComponent(e.author.replace(/\[bot\]$/, '')))}.png?size=40" alt="" loading="lazy" onerror="this.remove()">
    <b>@${esc(e.author)}</b>${cls ? `<span class="tag ${cls}">${verb}</span>` : `<span>${verb}</span>`}
    <a class="dim" href="${esc(httpsOnly(e.url) || '#')}" target="_blank" rel="noreferrer">${esc(ago(Date.parse(e.at)))}</a>`
  const body = e.bodyHtml.trim() ? `<div class="md">${githubHtml(e.bodyHtml)}</div>` : ''
  if (!body) return `<div class="entry"><div class="entry-head">${head}</div></div>`
  if (!e.bot) return `<div class="entry"><div class="entry-head">${head}</div>${body}</div>`
  return `<div class="entry"><div class="entry-head">${head}</div><details class="fold"><summary>${icon('chevron', 14)}Show</summary>${body}</details></div>`
}

// GitHub's rendered HTML, made to work here: links open in a new tab, and pictures a private repo serves come
// through /img with your token. Signed private-user-images links already work as they are.
function githubHtml(html) {
  const t = document.createElement('template')
  t.innerHTML = html
  for (const a of t.content.querySelectorAll('a[href]')) { a.target = '_blank'; a.rel = 'noreferrer' }
  for (const img of t.content.querySelectorAll('img[src]')) {
    img.loading = 'lazy'
    const m = img.getAttribute('src').match(/^https:\/\/(?:github\.com\/([^/]+\/[^/]+)\/(?:blob|raw)\/([^?#]+)|raw\.githubusercontent\.com\/([^?#]+))(?:[?#].*)?$/)
    const path = m && (m[3] || `${m[1]}/${m[2]}`)
    if (path && /\.(png|jpe?g|gif|webp)$/i.test(path)) img.src = `/img/${path}`
  }
  for (const el of t.content.querySelectorAll('script, style, iframe, object, embed')) el.remove()
  return t.innerHTML
}

// Fetches what the panel's view shows for the open PR, unless the copy on hand is from the PR's current update
// and under a minute old.
async function loadDetail(force = false) {
  const pr = S.detail && findPr(S.detail)
  if (!pr) return
  const [store, path] = S.view === 'code' ? [S.files, 'pr-files'] : [S.details, 'pr-detail']
  const have = store[pr.url]
  if (!force && have?.data && have.updatedAt === pr.updatedAt && Date.now() - have.at < 60000) return
  try {
    const data = await api(`/api/${path}?url=${encodeURIComponent(pr.url)}`)
    store[pr.url] = { data, at: Date.now(), updatedAt: pr.updatedAt }
  } catch (e) {
    store[pr.url] = { ...have, error: e.message, at: Date.now() }
  }
  renderDetail()
}

async function loadPeople(repo) {
  if (S.people[repo]) return
  try { S.people[repo] = await api(`/api/people?repo=${encodeURIComponent(repo)}`) } catch { S.people[repo] = [] }
  renderDetail()
}

// Opening a PR adds a tab for it, at most six; `replace` swaps the current tab instead, as j and k do.
function openDetail(k, replace = false) {
  if (S.detail === k) return
  const at = S.tabs.indexOf(S.detail)
  if (!S.tabs.includes(k)) {
    if (replace && at >= 0) S.tabs[at] = k
    else S.tabs = [...S.tabs, k].slice(-6)
  }
  S.detail = k
  S.menu = null
  S.picking = false
  renderBoard()
  loadDetail()
}

function closeTab(k) {
  const i = S.tabs.indexOf(k)
  S.tabs = S.tabs.filter(t => t !== k)
  if (S.detail !== k) return renderDetail()
  if (!S.tabs.length) return closeDetail()
  openDetail(S.tabs[Math.min(i, S.tabs.length - 1)])
}

function closeDetail() {
  if (!S.detail) return
  S.detail = null
  S.tabs = []
  $('#detail').classList.remove('anim')
  renderBoard()
}

// j and k walk the rows as the board shows them, opening each in the panel.
function stepDetail(by) {
  const keys = [...document.querySelectorAll('#board .pr')].map(el => el.dataset.key)
  if (!keys.length) return
  const i = keys.indexOf(S.detail)
  const k = keys[i < 0 ? 0 : Math.min(keys.length - 1, Math.max(0, i + by))]
  openDetail(k, true)
  document.querySelector(`#board .pr[data-key="${CSS.escape(k)}"]`)?.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
}

// ---------- run cards ----------

// Under its PR the card names the run's kind; the triage card names the run.
function runCard(r) {
  const id = esc(r.id)
  const under = prOf(r)
  const open = S.openRun === r.id
  // Claude Code reports an API-price estimate on every run; it is only money spent when the run used an API key.
  const billed = r.costUsd && r.apiKeySource && r.apiKeySource !== 'none' ? `$${r.costUsd.toFixed(2)} API` : ''
  const status = active(r) && r.stopRequested ? 'stopping' : r.status
  const meta = [status, dur((r.endedAt || Date.now()) - r.startedAt), billed, `${r.mode} mode`].filter(Boolean).join(' · ')
  let body = ''
  // Collapsed cards say what the run is doing now (and how recently it moved), or what it said last.
  const said = lastSaid(r)
  const doing = active(r) ? r.events.findLast(e => e.kind === 'text' || e.kind === 'tool') : null
  const preview = open ? ''
    : doing ? `<div class="run-preview">${esc(doing.kind === 'tool' ? `Running ${firstLine(doing.text)}` : firstLine(doing.text))}<span class="run-pulse"> · active ${esc(ago(doing.at))}</span></div>`
    : said ? `<div class="run-preview">${esc(firstLine(said.text))}</div>` : ''
  if (open) {
    const shown = said || r.events.findLast(e => e.kind === 'text') || r.events.findLast(e => e.kind === 'tool' || e.kind === 'note')
    const output = shown ? (shown.kind === 'tool' ? `Working: ${esc(shown.text)}` : inline(shown.text)) : 'Starting…'
    const events = S.fullLog[r.id] || r.events
    const partial = !S.fullLog[r.id] && r.eventCount > r.events.length ? `<div class="ev-note">Showing the last ${r.events.length} of ${r.eventCount} events.</div>` : ''
    const log = S.logOpen[r.id] ? `<div class="log" data-run="${id}">
        ${r.prompt ? `<div class="ev-note">Prompt</div><div class="ev-you" style="align-self:stretch;max-width:none">${esc(r.prompt)}</div>` : ''}${partial}
        ${events.map(e => `<div class="ev-${e.kind}">${e.kind === 'text' || e.kind === 'result' ? inline(e.text) : esc(e.text)}</div>`).join('')}
      </div>` : ''
    const reply = S.replyOpen[r.id] && !active(r) ? `<div class="reply">
        <textarea class="input" id="reply-${id}" data-act="reply-draft" data-run="${id}" placeholder="Reply to Claude in this run">${esc(S.replyDrafts[r.id] || '')}</textarea>
        <div class="run-acts"><button class="btn btn-sm btn-primary" data-act="reply-send" data-run="${id}">Send</button><button class="btn btn-sm btn-ghost" data-act="reply-cancel" data-run="${id}">Cancel</button></div>
      </div>` : ''
    const acts = active(r)
      ? `<button class="btn btn-sm" data-act="run-stop" data-run="${id}" ${r.stopRequested ? 'disabled' : ''}>${r.stopRequested ? 'Stopping…' : 'Stop'}</button>`
      : `<button class="btn btn-sm" data-act="reply-open" data-run="${id}">Reply</button>
         ${r.status === 'failed' ? `<button class="btn btn-sm" data-act="run-again" data-run="${id}">Retry</button>` : r.status !== 'done' ? `<button class="btn btn-sm" data-act="run-retry" data-run="${id}">Resume</button>` : ''}
         ${r.sessionStarted ? `<button class="btn btn-sm" data-act="run-terminal" data-run="${id}">Open in Terminal</button>` : ''}
         <button class="btn btn-sm btn-ghost" data-act="run-dismiss" data-run="${id}">Dismiss</button>`
    body = `<div class="run-body">
      <div class="run-output">${output}</div>
      <div class="run-cwd">${esc(tilde(r.sessionCwd || r.cwd))}</div>
      <div class="run-acts">${acts}<button class="btn btn-sm btn-ghost" data-act="run-log" data-run="${id}">${S.logOpen[r.id] ? 'Hide log' : 'Full log'}</button></div>
      ${reply}${log}
    </div>`
  }
  return `<div class="run${open ? ' open' : ''}${active(r) ? ' working' : ''}${S.flash === r.id ? ' flash' : ''}" id="run-${id}" data-enter="run:${id}" data-sig="${esc(cardSig(r))}" style="--dot:${RUN_DOT[r.status] || 'var(--mute)'}">
    <button class="run-toggle" data-act="run-toggle" data-run="${id}" aria-expanded="${open}">
      <div class="run-top"><span class="dot"></span><span class="run-title">${esc(under ? runName(r) : r.title)}</span>${icon('chevron', 14, 'chev')}</div>
      <div class="run-meta">${esc(meta)}</div>${preview}
    </button>${body}
  </div>`
}

// What decides whether a card needs drawing again; each card carries the one it was drawn with. An active run
// also redraws every 5 s for its clock.
const cardSig = r => JSON.stringify([r.status, r.updatedAt, r.stopRequested, S.openRun === r.id, !!S.logOpen[r.id], S.fullLog[r.id]?.at(-1)?.at,
  !!S.replyOpen[r.id], S.flash === r.id, active(r) ? Math.floor(Date.now() / 5000) : 0])

// Redraws only the cards on screen that changed, keeping the scroll of their output and log, so reading or
// selecting text in one run is not reset while another run streams.
function renderRuns() {
  keepFocus(() => {
    for (const r of S.runs) {
      const el = document.getElementById(`run-${r.id}`)
      if (!el || el.dataset.sig === cardSig(r)) continue
      const scroll = saveScroll(el)
      el.outerHTML = runCard(r)
      const card = document.getElementById(`run-${r.id}`)
      animateNew(card)
      restoreScroll(card, scroll)
    }
  })
}

function saveScroll(root) {
  const out = {}
  root.querySelectorAll('.log, .run-output').forEach(el => {
    const key = `${el.closest('.run')?.id}:${el.className}`
    out[key] = { top: el.scrollTop, atEnd: el.scrollHeight - el.scrollTop - el.clientHeight < 24 }
  })
  return out
}

function restoreScroll(root, saved) {
  root?.querySelectorAll('.log, .run-output').forEach(el => {
    const s = saved[`${el.closest('.run')?.id}:${el.className}`]
    el.scrollTop = el.classList.contains('log') && (!s || s.atEnd) ? el.scrollHeight : s ? s.top : 0
  })
}

// ---------- dialogs (the system's .dialog) ----------

function renderDialog() {
  keepFocus(drawDialog)
}

function drawDialog() {
  const d = S.dialog
  if (!d) { $('#dialog').innerHTML = ''; return }
  const frame = (title, body, actions) => `<div class="dialog-backdrop" data-act="dialog-backdrop"><div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}">
      <div class="dialog-title">${esc(title)}</div><div class="dialog-body" style="display:flex;flex-direction:column;gap:12px">${body}</div><div class="dialog-actions">${actions}</div></div></div>`
  const cancel = '<button class="btn" data-act="dialog-close">Cancel</button>'
  const pr = d.k ? findPr(d.k) : null
  if (d.k && !pr) { S.dialog = null; $('#dialog').innerHTML = ''; return }
  if (d.type === 'ask') {
    const quick = (LANE[pr.lane].quick || QUICK).map(([t, w]) => `<button class="btn btn-sm" data-act="quick" data-text="${esc(t)}" data-writes="${w}">${esc(t)}</button>`).join('')
    // PRs a run may not write to (forks, unsafe branch names) only get a read-only Ask.
    const write = !pr.writable ? '' : `<label class="check"><input type="checkbox" id="ask-write" data-act="ask-write"${d.write ? ' checked' : ''}> Let Claude change code and push</label>`
    $('#dialog').innerHTML = frame(`Ask Claude about ${short(pr)}`,
      `<textarea class="input" id="ask-input" data-act="draft" placeholder="For example: CI is failing here, fix it.">${esc(S.drafts[d.k] || '')}</textarea>
       ${write}
       <div class="quick">${quick}</div>`,
      `${cancel}<button class="btn btn-primary" data-act="ask-send">Send to Claude</button>`)
  } else if (d.type === 'confirm') {
    const c = VERBS[d.verb].confirm
    $('#dialog').innerHTML = frame(c.title(pr), c.body(pr), `${cancel}<button class="btn btn-primary" data-act="dialog-go">${c.go}</button>`)
  } else if (d.type === 'ship') {
    // Keys were fixed when the dialog opened; `d.admin` holds the PRs you ticked for an admin merge, and
    // `d.repo` with nothing to merge is a plain release. `d.release` false merges and releases nothing.
    const { prs, forced, repos } = shipSet(d)
    const merges = prs.length + forced.length
    const checking = d.release && repos.some(r => !S.plans[r] && !S.planErrors[r])
    const releasing = d.release ? repos.filter(releasable) : []
    const groups = repos.map(repo => {
      const merging = prs.filter(pr => pr.repo === repo)
      const p = S.plans[repo]
      const head = !d.release ? '' : p?.method === 'tag' ? `<span class="ver">${esc(p.latest)} → ${esc(p.next || '?')}</span>` : p?.latest ? `<span class="ver">latest ${esc(p.latest)}</span>` : ''
      const admin = adminCandidates(repo, d).map(pr => `<label class="check"><input type="checkbox" data-act="ship-admin" data-key="${esc(keyOf(pr))}"${d.admin.includes(keyOf(pr)) ? ' checked' : ''}>
          <span>Admin-merge #${pr.number} ${esc(pr.title)} <span>(${esc(blockers(pr))})</span></span></label>`).join('')
      const note = d.release ? `<p>${shipNote(repo, merges > 0 && (merging.length > 0 || forced.some(pr => pr.repo === repo)))}</p>${outNote(repo, merging, d)}` : ''
      return `<div class="ship-repo"><div class="head">${esc(repoName(repo))}${head}</div>
        ${merging.length ? `<ul>${merging.map(pr => `<li>#${pr.number} <span>${esc(pr.title)}</span></li>`).join('')}</ul>` : ''}${admin}${note}</div>`
    }).join('')
    const word = forced.length ? 'Admin-merge' : 'Merge'
    const andRelease = releasing.length ? ' and release' : ''
    // A plain release names its repo; ticks you cleared in the dialog leave nothing to do.
    const title = !merges ? (d.repo ? `Release ${repoName(d.repo)}${S.plans[d.repo]?.next ? ' ' + S.plans[d.repo].next : ''}?` : 'Nothing ticked to merge')
      : merges === 1 ? `${word}${andRelease} ${short(prs[0] || forced[0])}?` : `${word} ${merges}${releasing.length ? ` and release ${plural(releasing.length, 'repo')}` : ''}?`
    const how = !merges ? '' : `<p style="margin:0">Squash-merges each PR, pinned to the commit shown here. ${d.release ? 'A repo releases after its merges, and only when at least one of them went through.' : 'Nothing is released.'}</p>`
    const warn = forced.length ? `<p class="admin-warn"><b>Admin merge skips branch protection</b> for ${forced.map(pr => '#' + pr.number).join(', ')}. Nobody has approved ${forced.length === 1 ? 'it' : 'them'} yet, and a PR behind its base merges without CI having run on today's base. GitHub still refuses in a repo that enforces its rules for admins.</p>` : ''
    const go = checking ? 'Checking releases…' : `${forced.length ? 'Admin merge' : merges || !d.repo ? 'Merge' : 'Release'}${merges && releasing.length ? ' &amp; release' : ''}`
    $('#dialog').innerHTML = frame(title, `<div class="ship-list">${groups}</div>${how}${warn}`,
      `${cancel}<button class="btn ${forced.length ? 'btn-admin' : 'btn-primary'}" data-act="ship-go" ${checking || (!merges && !(d.repo && releasing.length)) ? 'disabled' : ''}>${go}</button>`)
  } else if (d.type === 'bulk') {
    const lane = LANE[d.lane]
    const { verb, label } = lane.bulk
    // The list you read is the list that runs: keys were fixed when the dialog opened.
    const prs = d.keys.map(findPr).filter(Boolean)
    const note = VERBS[verb].run
      ? `<p style="margin:0">Each PR gets its own Claude session in its own git worktree, so they run at once and never touch your checkout.${verb === 'relevance' ? ' Claude closes the ones that no longer matter (no comment, branch kept) and rescues the rest.' : ''}</p>`
      : `<p style="margin:0">${verb === 'merge' ? 'Squash-merges them one at a time. A PR GitHub refuses, or one that changed since you opened this, is skipped and reported.' : 'Merges each base branch into its PR on GitHub, one at a time.'}</p>`
    $('#dialog').innerHTML = frame(`${label} ${prs.length}?`,
      `<ul>${prs.map(pr => `<li>${esc(short(pr))} <span>${esc(pr.title)}</span></li>`).join('')}</ul>${note}`,
      `${cancel}<button class="btn btn-primary" data-act="bulk-go" ${prs.length ? '' : 'disabled'}>${VERBS[verb].run ? `Start ${plural(prs.length, 'Claude run')}` : `${esc(label)} ${prs.length}`}</button>`)
  }
}

// What releasing `repo` does, in the Merge & release dialog. `merging`: some of its PRs merge first.
function shipNote(repo, merging) {
  const p = S.plans[repo]
  if (!p) return S.planErrors[repo] ? `Could not check how it releases (${esc(S.planErrors[repo])}), so it only merges.` : 'Checking how it releases…'
  if (p.method === 'none') return 'This repo has no releases yet, so it only merges.'
  const branch = `<code>${esc(p.branch)}</code>`
  const step = p.method === 'tag' ? `creates release <b>${esc(p.next || '?')}</b> on ${branch} with GitHub's generated notes` : `runs the repo's <code>release.yml</code> workflow on ${branch}, which picks the version`
  const since = p.unreleased ? `${plural(p.unreleased, 'commit')} on ${branch} since ${esc(p.latest)}` : ''
  if (merging) return `Then PR Inbox ${step}.${since ? ` The release also takes the ${since}, not released yet.` : ''}`
  return since ? `PR Inbox ${step}, for the ${since}.` : `Nothing new on ${branch} since ${esc(p.latest)}.`
}

// The repo's open PRs that stay out of this release, and why, so a release never looks like it merges them.
function outNote(repo, merging, d) {
  if (!releasable(repo)) return ''
  const offered = adminCandidates(repo, d)
  const out = leftOut(repo).filter(pr => !offered.includes(pr)).concat(lanePrs('ready').filter(pr => pr.repo === repo && !merging.includes(pr)))
  return out.length ? `<p>Not included: ${esc(leftOutText(out))}.</p>` : ''
}

// Your idle PRs in `repo` the dialog offers for an admin merge: the ones the server marked as held back
// only by their approval or by being behind, and not already merging the normal way. `d.offer`, when set,
// narrows them to the PRs you ticked on the board.
const adminCandidates = (repo, d) => S.data.mine.filter(pr => pr.repo === repo && pr.adminMergeable && idle(pr) && !d.keys.includes(keyOf(pr))
  && (!d.offer || d.offer.includes(keyOf(pr))))

// What a Merge & release dialog takes: PRs merging normally, PRs ticked for an admin merge, and their repos.
// An offered PR keeps its repo on the list after you untick it, so you can tick it again.
function shipSet(d) {
  const prs = d.keys.map(findPr).filter(Boolean)
  const forced = d.admin.map(findPr).filter(pr => pr?.adminMergeable)
  const offered = (d.offer || []).map(findPr).filter(Boolean)
  const repos = [...new Set([d.repo, ...offered.map(pr => pr.repo), ...prs.map(pr => pr.repo), ...forced.map(pr => pr.repo)].filter(Boolean))]
  return { prs, forced, repos }
}

function openDialog(d) {
  S.dialog = d
  S.menu = null
  renderBoard()
  renderDialog()
  $('.dialog-backdrop')?.classList.add('anim')
  if (d.type === 'ask') focusEnd('ask-input')
  else $('#dialog .btn-primary')?.focus()
}

function closeDialog() { S.dialog = null; renderDialog() }

function renderAll() { renderHeader(); renderNotice(); renderBoard(); renderDialog() }

// ---------- data ----------

let retried = false
let prsSeq = 0
async function loadPrs() {
  // Responses can arrive out of order; only the newest request's answer is used.
  const seq = ++prsSeq
  S.loading = true
  renderHeader()
  try {
    const data = await api('/api/prs')
    if (seq !== prsSeq) return
    S.data = data
    S.error = null
    loadPlans()
    loadDetail()
    // GitHub works out mergeability lazily: ask once more so "CI running" rows settle.
    retried = !retried && S.data.settling
    if (retried) setTimeout(loadPrs, 6000)
  } catch (e) {
    if (seq === prsSeq) S.error = e.message
  } finally {
    if (seq === prsSeq) {
      S.loading = false
      renderAll()
    }
  }
}

// How your repos release. The server reuses a repo's answer for five minutes, so this follows every PR load.
let plansSeq = 0
async function loadPlans() {
  const seq = ++plansSeq
  try {
    const r = await api('/api/releases')
    if (seq !== plansSeq) return
    S.plans = r.plans
    S.planErrors = r.errors
    renderBoard()
    if (S.dialog?.type === 'ship') renderDialog()
  } catch {}
}

let runsTimer = null
async function loadRuns() {
  clearTimeout(runsTimer)
  try {
    const before = new Map(S.runs.map(r => [r.id, r.status]))
    S.runs = await api('/api/runs')
    // An open full log keeps up with a run that is still working.
    for (const id of Object.keys(S.fullLog)) {
      const r = S.runs.find(x => x.id === id)
      if (!r || !S.logOpen[id]) delete S.fullLog[id]
      else if (active(r) || before.get(id) !== r.status) loadFullLog(id)
    }
    renderRuns()
    if (S.runs.some(r => before.get(r.id) !== r.status) || before.size !== S.runs.length) {
      renderBoard()
      for (const r of S.runs.filter(r => before.get(r.id) === 'running' && !active(r))) {
        if (r.status === 'done') toast(`Claude finished: ${r.title}`)
        else if (r.status === 'failed') toast(`Claude run failed: ${r.title}`, true)
      }
      if (S.runs.some(r => before.get(r.id) === 'running' && !active(r))) setTimeout(loadPrs, 3000)
    }
  } catch {}
  runsTimer = setTimeout(loadRuns, S.runs.some(active) && !document.hidden ? 1500 : 8000)
}

async function loadFullLog(id) {
  try {
    const r = await api(`/api/runs/${id}`)
    if (S.logOpen[id]) { S.fullLog[id] = r.events; renderRuns() }
  } catch {}
}

async function loadHealth() {
  try { S.health = await api('/api/health'); renderNotice(); renderBoard() } catch {}
}

// ---------- actions ----------

// Opens a run's card where it lives: under its PR, unfolding the PR's runs, or inside the triage card.
function showRun(id) {
  const pr = prOf(S.runs.find(r => r.id === id) || {})
  if (pr) S.runsOpen[keyOf(pr)] = true
  S.openRun = id
  S.flash = id
  renderBoard()
  document.getElementById(`run-${id}`)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' })
  setTimeout(() => { S.flash = null; renderRuns() }, 1500)
}

// Says a run started (or queued) and opens its card.
function announce(run) {
  toast(run.status === 'queued' ? `Queued: ${run.title}` : `Claude started: ${run.title}`)
  showRun(run.id)
}

// Starts a triage or morning summary over every PR and opens its card; returns whether it started.
async function startOverview(kind) {
  try {
    const run = await api('/api/runs', { kind })
    await loadRuns()
    announce(run)
    return true
  } catch (e) { toast(e.message, true); return false }
}

// Starts one Claude run per PR, one request at a time, with each row showing its progress. A row keeps
// its mark until the runs are loaded, so it goes straight to its run label; returns the runs that started.
async function startEach(kind, prs, note) {
  const runs = []
  for (const pr of prs) S.busy[keyOf(pr)] = 'Waiting'
  for (const pr of prs) {
    S.busy[keyOf(pr)] = 'Starting Claude'
    renderBoard()
    try { runs.push(await api('/api/runs', { kind, url: pr.url, note })) }
    catch (e) { toast(`Starting Claude on ${short(pr)} failed: ${e.message}`, true) }
  }
  await loadRuns()
  for (const pr of prs) delete S.busy[keyOf(pr)]
  renderBoard()
  return runs
}

async function startRun(kind, pr, note) {
  const k = keyOf(pr)
  // One start at a time per PR: the row shows the request in flight and its buttons are gone meanwhile.
  if (S.busy[k]) return
  const [run] = await startEach(kind, [pr], note)
  if (!run) return
  delete S.drafts[k]
  announce(run)
}

// Runs one gh action per PR, one at a time, with each row showing its progress; returns the PRs it succeeded on.
async function ghEach(verb, prs) {
  const { gh, doing, did } = VERBS[verb]
  const ok = []
  for (const pr of prs) S.busy[keyOf(pr)] = 'Waiting'
  for (const pr of prs) {
    const k = keyOf(pr)
    S.busy[k] = doing
    renderBoard()
    try {
      await api('/api/pr-action', { action: gh, url: pr.url, headSha: pr.headSha })
      S.done[k] = { label: did, at: Date.now() }
      ok.push(pr)
    } catch (e) { toast(`${doing} ${short(pr)} failed: ${e.message}`, true) }
    delete S.busy[k]
  }
  renderBoard()
  setTimeout(loadPrs, 1500)
  return ok
}

// A verb with a gh action runs it; any other starts its Claude run.
const perform = (v, pr) => VERBS[v].gh ? ghEach(v, [pr]) : startRun(VERBS[v].run, pr, VERBS[v].note)

// Starts a finished run's kind again, fresh: on its PR's worktree as it is today, or over every PR for a triage
// or morning summary. A request in your own words has no kind to start from, so it resumes its run, and a kind
// that asks first opens its confirmation. Returns whether a run started.
async function again(r) {
  if (resumes(r)) return runVerb(r.id, 'retry')
  if (!r.prUrl) return startOverview(r.kind)
  const pr = allPrs().find(p => p.url === r.prUrl)
  if (!pr) { toast('That PR is no longer in your list', true); return false }
  const v = Object.keys(VERBS).find(v => VERBS[v].run === r.kind)
  if (VERBS[v]?.confirm) { openDialog({ type: 'confirm', verb: v, k: keyOf(pr) }); return false }
  return (await startEach(r.kind, [pr])).length > 0
}

// Starts again each kind whose last run on the PR failed, one after another: writing runs on one PR queue.
async function retryAll(pr) {
  let n = 0
  for (const r of retryable(pr)) n += await again(r) ? 1 : 0
  if (n) toast(`Started ${plural(n, 'Claude run')} on ${short(pr)}`)
}

async function runBulk() {
  const d = S.dialog
  const { verb } = LANE[d.lane].bulk
  const V = VERBS[verb]
  const prs = d.keys.map(findPr).filter(Boolean)
  closeDialog()
  S.bulkBusy[d.lane] = true
  try {
    if (V.gh) {
      const ok = await ghEach(verb, prs)
      toast(`${V.did} ${ok.length} of ${prs.length}`)
      return
    }
    const runs = await startEach(V.run, prs, V.note)
    toast(`Started ${plural(runs.length, 'Claude run')}`)
  } finally {
    delete S.bulkBusy[d.lane]
    renderBoard()
  }
}

// Releases one repo the way it releases, after a merge or on its own.
async function releaseRepo(repo) {
  S.releasing[repo] = true
  renderBoard()
  try {
    const r = await api('/api/release', { repo })
    toast(r.message, false, r.link)
  } catch (e) { toast(`Releasing ${repoName(repo)} failed: ${e.message}`, true) }
  delete S.releasing[repo]
  delete S.plans[repo]
  renderBoard()
  loadPlans()
}

// Merge & release: per repo, merge its PRs one at a time, then release it once if any of them merged.
// Normal merges go first: in a repo that wants branches up to date, the first merge leaves the rest behind,
// and only the admin merges get past that.
async function ship(d) {
  const { prs, forced, repos } = shipSet(d)
  closeDialog()
  for (const pr of [...prs, ...forced]) {
    S.busy[keyOf(pr)] = 'Waiting'
    S.picked.delete(keyOf(pr))
  }
  for (const repo of repos) {
    const normal = prs.filter(pr => pr.repo === repo)
    const admin = forced.filter(pr => pr.repo === repo)
    const merged = [...(normal.length ? await ghEach('merge', normal) : []), ...(admin.length ? await ghEach('admin', admin) : [])]
    if (normal.length + admin.length && !merged.length) continue
    if (d.release && releasable(repo)) await releaseRepo(repo)
  }
}

function openShip(keys, { repo = null, admin = [], offer = null, release = true } = {}) {
  openDialog({ type: 'ship', keys, repo, admin, offer, release })
  loadPlans()
}

function setGroup(group) {
  S.group = group
  remember('group', group)
  for (const key of [...S.seen]) if (key.startsWith('lane:') || key.startsWith('repo:')) S.seen.delete(key)
  renderHeader()
  renderBoard()
}

function setShow(show) {
  S.show = show
  remember('show', show)
  renderHeader()
  renderBoard()
}

function setSort(repo, sort) {
  S.sorts[repo] = sort
  remember(`sort:${repo}`, sort)
  renderBoard()
}

// Returns whether the server took it.
async function runVerb(id, verb, body = {}, done) {
  let ok = false
  try { await api(`/api/runs/${id}/${verb}`, body); ok = true; if (done) toast(done) } catch (e) { toast(e.message, true) }
  loadRuns()
  return ok
}

// Every data-act resolves here. Each handler gets the PR of the row it sits in (or the dialog's PR), the run id, the lane and the element.
const ACTIONS = {
  refresh: () => loadPrs(),
  triage: () => startOverview('triage'),
  filter: ({ lane }) => {
    S.lane = lane
    for (const key of [...S.seen]) if (key.startsWith('lane:')) S.seen.delete(key)
    renderHeader()
    renderBoard()
  },
  group: ({ el }) => setGroup(el.dataset.group),
  show: ({ el }) => setShow(el.dataset.show),
  sort: ({ el }) => setSort(el.dataset.repo, el.dataset.sort),
  login: async ({ el }) => {
    try {
      await api(`/api/login/${el.dataset.tool}`, {})
      toast('Finish signing in in the Terminal window, then press "I\'ve signed in"')
    } catch (e) { toast(e.message, true) }
  },
  recheck: async () => { await loadHealth(); loadPrs() },
  'toggle-summary': () => {
    S.summaryOpen = !S.summaryOpen
    renderBoard()
    if (S.summaryOpen) $('.hero-detail')?.classList.add('anim-fade')
  },
  'show-run': ({ run }) => showRun(run),
  'runs-toggle': ({ k }) => { S.runsOpen[k] = !S.runsOpen[k]; renderBoard() },
  'retry-all': ({ pr }) => retryAll(pr),
  'run-toggle': ({ run }) => {
    S.openRun = S.openRun === run ? null : run
    renderBoard()
    if (S.openRun) document.getElementById(`run-${S.openRun}`)?.querySelector('.run-body')?.classList.add('anim-fade')
  },
  'run-log': ({ run }) => {
    S.logOpen[run] = !S.logOpen[run]
    if (S.logOpen[run]) loadFullLog(run); else delete S.fullLog[run]
    renderRuns()
  },
  'reply-open': ({ run }) => { S.replyOpen[run] = true; renderRuns(); focusEnd(`reply-${run}`) },
  'reply-cancel': ({ run }) => { delete S.replyOpen[run]; renderRuns() },
  // The draft is only cleared once the server took the reply, so a refused reply keeps its text.
  'reply-send': async ({ run }) => {
    const text = (S.replyDrafts[run] || '').trim()
    if (!text) return
    try {
      await api(`/api/runs/${run}/reply`, { text })
      delete S.replyDrafts[run]
      delete S.replyOpen[run]
    } catch (e) { toast(e.message, true) }
    loadRuns()
  },
  'run-stop': ({ run }) => runVerb(run, 'stop'),
  'run-again': ({ run }) => again(S.runs.find(r => r.id === run)),
  'run-retry': ({ run }) => runVerb(run, 'retry'),
  'run-terminal': ({ run }) => runVerb(run, 'terminal', {}, 'Opened in Terminal'),
  'run-dismiss': ({ run }) => runVerb(run, 'dismiss'),
  menu: ({ el }) => {
    const key = el.dataset.menu
    S.menu = S.menu === key ? null : key
    renderBoard()
    if (S.menu) $('.menu')?.classList.add('anim')
  },
  'detail-close': () => closeDetail(),
  tab: ({ el, ev }) => ev.target.closest('[data-act="tab-close"]') ? closeTab(el.dataset.key) : openDetail(el.dataset.key),
  'tab-close': ({ el }) => closeTab(el.dataset.key),
  view: ({ el }) => { S.view = el.dataset.view; renderDetail(); loadDetail() },
  jump: ({ el, ev }) => {
    ev.preventDefault()
    const f = document.getElementById(`file-${el.dataset.i}`)
    if (f) { f.open = true; f.scrollIntoView({ behavior: 'smooth', block: 'start' }) }
  },
  checkout: async () => {
    const pr = findPr(S.detail)
    try { await api('/api/pr-checkout', { url: pr.url }); toast(`Checking out ${short(pr)} in Terminal`) } catch (e) { toast(e.message, true) }
  },
  copy: async ({ el }) => {
    try { await navigator.clipboard.writeText(el.dataset.text); toast(`Copied ${el.dataset.text}`) } catch { toast('Could not reach the clipboard', true) }
  },
  'pick-reviewer': () => {
    S.picking = !S.picking
    renderDetail()
    if (S.picking) { loadPeople(findPr(S.detail).repo); $('#reviewer-input')?.focus() }
  },
  'add-reviewer': async () => {
    const pr = findPr(S.detail)
    const login = ($('#reviewer-input')?.value || '').trim().replace(/^@/, '')
    if (!login) return
    try {
      await api('/api/pr-reviewer', { url: pr.url, login })
      toast(`Asked @${login} to review ${short(pr)}`)
      S.picking = false
      loadPrs()
    } catch (e) { toast(e.message, true) }
  },
  // The draft stays until GitHub took the comment, so a refused one keeps its text.
  'comment-send': async () => {
    const pr = findPr(S.detail)
    const body = (S.comments[pr.url] || '').trim()
    if (!body || S.posting) return
    S.posting = true
    renderDetail()
    try {
      await api('/api/pr-comment', { url: pr.url, body })
      delete S.comments[pr.url]
      toast(`Commented on ${short(pr)}`)
      S.posting = false
      await loadDetail(true)
    } catch (e) { toast(e.message, true); S.posting = false; renderDetail() }
  },
  'detail-reload': () => loadDetail(true),
  ask: ({ k }) => openDialog({ type: 'ask', k, write: true }),
  // Every row button and menu item that acts on a PR: confirm first when the verb asks for it.
  verb: ({ el, pr, k }) => {
    const v = el.dataset.verb
    if (v === 'admin') return openShip([], { repo: pr.repo, admin: [k] })
    return VERBS[v].ship ? openShip([k]) : VERBS[v].confirm ? openDialog({ type: 'confirm', verb: v, k }) : perform(v, pr)
  },
  'dialog-go': ({ pr }) => { const v = S.dialog.verb; closeDialog(); return perform(v, pr) },
  'bulk-open': ({ lane }) => openDialog({ type: 'bulk', lane, keys: actionable(lane).map(keyOf) }),
  'bulk-go': () => runBulk(),
  'merge-repo': ({ el }) => openDialog({ type: 'bulk', lane: 'ready', keys: mergeable(el.dataset.repo).map(keyOf) }),
  'ship-open': ({ el }) => openShip(shippable(el.dataset.repo).map(keyOf)),
  'release-open': ({ el }) => openShip([], { repo: el.dataset.repo }),
  pick: ({ el, k }) => { if (el.checked) S.picked.add(k); else S.picked.delete(k); renderBoard() },
  'pick-all': ({ el }) => {
    for (const k of JSON.parse(el.dataset.keys)) if (el.checked) S.picked.add(k); else S.picked.delete(k)
    renderBoard()
  },
  'pick-clear': () => { S.picked.clear(); renderBoard() },
  // Both buttons open the same dialog, so you read the list before anything merges. A heading's take only its ticks.
  'pick-go': ({ el }) => {
    const { keys, admin } = picks(el.dataset.keys ? JSON.parse(el.dataset.keys).map(findPr) : undefined)
    openShip(keys, { admin, offer: admin, release: el.dataset.release === 'true' })
  },
  'ship-go': () => ship(S.dialog),
  'ship-admin': ({ el }) => {
    const k = el.dataset.key
    S.dialog.admin = el.checked ? [...new Set([...S.dialog.admin, k])] : S.dialog.admin.filter(x => x !== k)
    renderDialog()
  },
  'dialog-close': () => closeDialog(),
  'dialog-backdrop': ({ el, ev }) => { if (ev.target === el) closeDialog() },
  quick: ({ k, el }) => { S.drafts[k] = el.dataset.text; S.dialog.write = el.dataset.writes === 'true'; renderDialog(); focusEnd('ask-input') },
  'ask-write': ({ el }) => { S.dialog.write = el.checked },
  // A request that may change code runs as a task in the PR's worktree; a question runs read-only.
  'ask-send': ({ pr, k }) => {
    const note = (S.drafts[k] || '').trim()
    if (!note) return toast('Write what you want Claude to do first', true)
    const kind = S.dialog.write && pr.writable ? 'task' : 'ask'
    closeDialog()
    return startRun(kind, pr, note)
  },
}

document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]')
  // Any click except the one that toggles it closes the row menu, links inside it included.
  if (S.menu && el?.dataset.act !== 'menu') { S.menu = null; renderBoard() }
  // Inside the app window, web links open in the default browser instead of replacing the app.
  const link = ev.target.closest('a[href]')
  // A row's title opens the PR here; ⌘-click still goes to GitHub.
  if (link?.dataset.act === 'detail' && !ev.metaKey && !ev.ctrlKey) {
    ev.preventDefault()
    return openDetail(link.closest('.pr').dataset.key)
  }
  if (link) {
    if (S.inApp && /^https:\/\//.test(link.href) && !link.href.startsWith(location.origin)) {
      ev.preventDefault()
      api('/api/open', { url: link.href }).catch(e => toast(e.message, true))
    }
    return
  }
  // A click on a row's empty space opens it too; its buttons, ticks and runs keep their own jobs.
  if (!el && !ev.target.closest('input, label, button, .strip, .strip-runs, .menu') && ev.target.closest('#board .pr .row') && !getSelection().toString()) {
    return openDetail(ev.target.closest('.pr').dataset.key)
  }
  const handler = el && ACTIONS[el.dataset.act]
  if (!handler) return
  const k = el.closest('.pr, .detail')?.dataset.key || (el.closest('#dialog') ? S.dialog?.k : null)
  handler({ el, ev, pr: k ? findPr(k) : null, k, run: el.dataset.run, lane: el.dataset.lane })
})

document.addEventListener('input', ({ target: t }) => {
  if (t.dataset.act === 'draft' && S.dialog) S.drafts[S.dialog.k] = t.value
  if (t.dataset.act === 'reply-draft') S.replyDrafts[t.dataset.run] = t.value
  if (t.dataset.act === 'comment-draft' && S.detail) S.comments[findPr(S.detail).url] = t.value
  if (t.id === 'search') { S.query = t.value; renderHeader(); renderBoard() }
})
document.addEventListener('keydown', ev => {
  const t = ev.target
  if ((ev.metaKey || ev.ctrlKey) && ev.key === 'Enter') {
    if (t.dataset.act === 'draft') { ev.preventDefault(); $('[data-act="ask-send"]')?.click() }
    if (t.dataset.act === 'reply-draft') { ev.preventDefault(); ACTIONS['reply-send']({ run: t.dataset.run }) }
    if (t.dataset.act === 'comment-draft') { ev.preventDefault(); ACTIONS['comment-send']() }
    return
  }
  // ⌘R reloads the whole app, page and data, from anywhere: the app window has no browser menu that would.
  if ((ev.metaKey || ev.ctrlKey) && !ev.altKey && ev.key.toLowerCase() === 'r') {
    ev.preventDefault()
    location.reload()
    return
  }
  if (t.id === 'reviewer-input' && ev.key === 'Enter') { ev.preventDefault(); return ACTIONS['add-reviewer']() }
  if (ev.key === 'Escape') {
    if (S.dialog) return closeDialog()
    // Esc in the search box clears it, then leaves it.
    if (t.id === 'search') { if (t.value) { t.value = ''; S.query = ''; renderHeader(); renderBoard() } else t.blur(); return }
    if (S.menu) { S.menu = null; return renderBoard() }
    if (S.detail) return closeDetail()
    if (S.picked.size) { S.picked.clear(); return renderBoard() }
  }
  if (t.matches('input, textarea') || S.dialog || ev.metaKey || ev.ctrlKey || ev.altKey) return
  if (ev.key === 'r') loadPrs()
  if (ev.key === 'g') setGroup(S.group === 'repo' ? 'lane' : 'repo')
  if (ev.key === '/') { ev.preventDefault(); $('#search').focus() }
  if (ev.key === 'j') stepDetail(1)
  if (ev.key === 'k') stepDetail(-1)
  if (ev.key === 'n') setShow(S.show === 'needs' ? 'all' : 'needs')
})
document.querySelectorAll('[data-icon]').forEach(el => { el.outerHTML = icon(el.dataset.icon) })
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return
  if (S.data && Date.now() - S.data.fetchedAt > 60000) loadPrs()
  loadRuns()
})
setInterval(() => { if (!document.hidden) loadPrs() }, 120000)
setInterval(() => { if (S.data && !S.loading) $('#updated').textContent = `Updated ${ago(S.data.fetchedAt)}` }, 15000)

renderAll()
loadPrs()
loadRuns()
loadHealth()
</script>
</body>
</html>
