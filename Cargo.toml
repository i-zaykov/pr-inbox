[package]
name = "pr-inbox"
version = "1.0.0"
edition = "2021"
description = "Your open GitHub pull requests, sorted by what to do next, with Claude Code one click away."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "net", "sync"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
